  // ---------- Modale "Registra esito" ----------

  function apriModaleEsito(idPrenotazione, nomePaziente, nomeServizio) {
    const item = visiteDaGestireCache.find(v => v.idPrenotazione === idPrenotazione);
    const idPaziente = item ? item.idPaziente : null;

    esitoPrenotazioneCorrente = { id: idPrenotazione, idPaziente, nomePaziente };

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'esitoOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel" style="max-width: 480px;">
        <p class="hl-modal-title">Registra esito visita</p>
        <p class="hl-modal-sub">${escapeHtml(nomeServizio)} — ${escapeHtml(nomePaziente)}</p>

        <div class="hl-form-field" style="margin-bottom: 0.9rem;">
          <label for="esitoNote">Note cliniche</label>
          <textarea id="esitoNote" class="hl-non-completata-textarea" style="width: 100%;"
            placeholder="Esito della valutazione…"></textarea>
        </div>

        <label class="hl-confirm-label" style="max-width: none; margin-bottom: 0.9rem;">
          <input type="checkbox" id="esitoConclusa" checked>
          Visita conclusa
        </label>

        <div class="hl-form-field" style="margin-bottom: 0.9rem;">
          <label for="esitoAutorizza">Autorizza prestazione (opzionale)</label>
          <select id="esitoAutorizza" disabled>
            <option value="">Caricamento opzioni…</option>
          </select>
        </div>

        <label class="hl-confirm-label" style="max-width: none; margin-bottom: 0.6rem;">
          <input type="checkbox" id="esitoAllegaReferto">
          Allega referto
        </label>

        <div class="hl-form-field" style="margin-bottom: 0.9rem;">
          <input type="file" id="esitoReferto" class="hl-upload-input" style="width: 100%;" disabled>
        </div>

        <p class="hl-sposta-error" id="esitoErrore"></p>

        <div class="hl-modal-actions">
          <button type="button" class="hl-btn-annulla-upload" id="esitoAnnullaBtn">Annulla</button>
          <button type="button" class="hl-btn-upload" id="esitoConfermaBtn">Registra esito</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleGenerico('esitoOverlay');
    });
    document.getElementById('esitoAnnullaBtn').addEventListener('click', () => chiudiModaleGenerico('esitoOverlay'));
    document.getElementById('esitoConfermaBtn').addEventListener('click', confermaEsito);
    document.getElementById('esitoAllegaReferto').addEventListener('change', (e) => {
      const fileInput = document.getElementById('esitoReferto');
      fileInput.disabled = !e.target.checked;
      if (!e.target.checked) fileInput.value = '';
    });

    // "Conclusa" e "autorizza una nuova prestazione" sono esclusivi:
    // spuntare "conclusa" significa "l'intero ciclo di visita termina qui", quindi disabilita e
    // azzera un eventuale autorizzazione. Togliendo la spunta si riapre
    // la possibilità di autorizzare (solo se esistono davvero opzioni).
    document.getElementById('esitoConclusa').addEventListener('change', (e) => {
      const selectEl = document.getElementById('esitoAutorizza');
      if (e.target.checked) {
        selectEl.value = '';
        selectEl.disabled = true;
      } else {
        selectEl.disabled = selectEl.dataset.hasOptions !== 'true';
      }
    });

    caricaPrestazioniAutorizzabili(idPrenotazione);
  }

  async function caricaPrestazioniAutorizzabili(idPrenotazione) {
    const selectEl = document.getElementById('esitoAutorizza');
    try {
      const res = await axios.get(`${API_BASE_URL}/medico/prenotazioni/${idPrenotazione}/prestazioni-autorizzabili`);
      const opzioni = res.data;

      if (!opzioni.length) {
        selectEl.innerHTML = '<option value="">Nessuna prestazione collegata a questa visita</option>';
        selectEl.disabled = true;
        selectEl.dataset.hasOptions = 'false';
        return;
      }

      selectEl.innerHTML = '<option value="">Nessuna</option>' +
        opzioni.map(o => `<option value="${o.id}">${escapeHtml(o.nome)}</option>`).join('');
      selectEl.dataset.hasOptions = 'true';

      // Rispetta lo stato attuale della checkbox "conclusa" (spuntata di
      // default all'apertura, quindi il dropdown resta disabilitato finché
      // l'utente non la rispunta).
      selectEl.disabled = document.getElementById('esitoConclusa').checked;

    } catch (error) {
      selectEl.innerHTML = '<option value="">Impossibile caricare le opzioni</option>';
      selectEl.disabled = true;
      selectEl.dataset.hasOptions = 'false';
    }
  }

  async function confermaEsito() {
    const errorEl = document.getElementById('esitoErrore');
    const btn = document.getElementById('esitoConfermaBtn');

    errorEl.textContent = '';

    const note = document.getElementById('esitoNote').value.trim();
    const conclusa = document.getElementById('esitoConclusa').checked;
    const selectAutorizza = document.getElementById('esitoAutorizza');
    const idAutorizzata = selectAutorizza.value;
    // Catturato subito, non dopo: una volta chiuso il modale il <select> viene
    // rimosso dal DOM, e leggerlo più tardi (com'era prima) restituiva null,
    // facendo fallire silenziosamente l'apertura del popup "Prenota subito".
    const nomePrestazioneAutorizzata = idAutorizzata
      ? selectAutorizza.options[selectAutorizza.selectedIndex].text
      : null;
    const allegaReferto = document.getElementById('esitoAllegaReferto').checked;
    const fileInput = document.getElementById('esitoReferto');

    if (allegaReferto && !fileInput.files.length) {
      errorEl.textContent = 'Seleziona un file da allegare, oppure togli la spunta "Allega referto".';
      return;
    }

    btn.disabled = true;
    btn.textContent = allegaReferto ? 'Caricamento referto…' : 'Salvataggio…';

    try {
      // "Transazione" lato frontend: se è richiesto un referto, va caricato
      // PRIMA e deve andare a buon fine — solo dopo si registra l'esito.
      if (allegaReferto) {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        await axios.post(`${API_BASE_URL}/referti/prenotazione/${esitoPrenotazioneCorrente.id}`, formData);
        btn.textContent = 'Salvataggio…';
      }

      await axios.post(`${API_BASE_URL}/medico/prenotazioni/${esitoPrenotazioneCorrente.id}/esito`, {
        note,
        conclusa,
        idPrestazionePreviaVisitaAutorizzata: idAutorizzata ? parseInt(idAutorizzata, 10) : null
      });

      chiudiModaleGenerico('esitoOverlay');

      const riga = document.getElementById(`visitaDaGestireRiga-${esitoPrenotazioneCorrente.id}`);
      if (riga) riga.remove();
      const bodyEl = document.getElementById('visiteDaGestireBody');
      if (bodyEl && !bodyEl.children.length) {
        document.getElementById('visiteDaGestireWrap').innerHTML =
          '<p class="hl-refertare-empty">Nessuna visita in attesa di esito.</p>';
      }

      // RF-14, punto 15: se è stata concessa un'autorizzazione, offriamo subito
      // la possibilità di prenotare per il paziente, con l'esecutore forzato al medico stesso
      // Opzione B: prenota direttamente il paziente.
      // Se il medico preferisce "abilitare il paziente" invece di prenotare
      // lui stesso, gli basta chiudere il popup. L'autorizzazione resta
      // valida per una prenotazione futura da parte del paziente.
      if (idAutorizzata && esitoPrenotazioneCorrente.idPaziente) {
        const idMedicoCorrente = parseInt(localStorage.getItem('healthlab_id_utente'), 10);

        apriModalePrenotaAutorizzata(
          esitoPrenotazioneCorrente.idPaziente,
          esitoPrenotazioneCorrente.nomePaziente,
          parseInt(idAutorizzata, 10),
          nomePrestazioneAutorizzata,
          idMedicoCorrente
        );
      }

    } catch (error) {
      btn.disabled = false;
      btn.textContent = 'Registra esito';
      errorEl.textContent = error.response?.data?.message || 'Operazione non riuscita. Riprova.';
    }
  }

  // ---------- Popup semplificato "Prenota subito" (RF-14, punto 15) ----------

  async function toggleUtenteAdmin(idUtente, disabilitatoAttuale) {
    const azione = disabilitatoAttuale ? 'riabilita' : 'disabilita';
    const messaggioConferma = disabilitatoAttuale
      ? 'Confermi la riattivazione di questo account?'
      : 'Confermi la disattivazione di questo account? Non potrà più accedere al sistema.';

    if (!confirm(messaggioConferma)) return;

    try {
      await axios.patch(`${API_BASE_URL}/admin/utenti/${idUtente}/${azione}`);
      await caricaUtentiAdmin(
        document.getElementById('utentiRicerca').value,
        document.getElementById('utentiFiltroRuolo').value
      );
    } catch (error) {
      alert(error.response?.data?.message || 'Operazione non riuscita. Riprova.');
    }
  }

      if (ruoloScelto === 'tecnico' || ruoloScelto === 'medico') {
        await caricaSpecializzazioniInSelect('nuSpecializzazione', ruoloScelto);
      }
    });

    document.getElementById('nuovoUtenteForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById('nuovoUtenteErrore');
      const btn = document.getElementById('nuovoUtenteConfermaBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Creazione…';

      const sedeVal = document.getElementById('nuSede').value;
      const specVal = document.getElementById('nuSpecializzazione').value;

        cognome: document.getElementById('nuCognome').value.trim(),
        username: document.getElementById('nuUsername').value.trim(),
        email: document.getElementById('nuEmail').value.trim(),
        telefono: document.getElementById('nuTelefono').value.trim(),

        idSede: sedeVal ? parseInt(sedeVal, 10) : null,
        idSpecializzazione: specVal ? parseInt(specVal, 10) : null,
        numeroAlbo: document.getElementById('nuNumeroAlbo').value.trim() || null,
        biografia: document.getElementById('nuBiografia').value.trim() || null
      };

      try {
        await axios.post(`${API_BASE_URL}/admin/utenti`, payload);
        chiudiModaleGenerico('nuovoUtenteOverlay');
        await caricaUtentiAdmin(
          document.getElementById('utentiRicerca')?.value || '',
          document.getElementById('utentiFiltroRuolo')?.value || ''
        );
      } catch (error) {
        btn.disabled = false;
        btn.textContent = 'Crea';
        errorEl.textContent = error.response?.data?.message || 'Creazione non riuscita. Riprova.';
      }
    });
  }

  // ---------- Modale "Modifica utente" ----------

  function apriModaleModificaUtente(idUtente) {
    const utente = utentiAdminCache.find(u => u.id === idUtente);
    if (!utente) return;

    const mostraSpecializzazione = utente.ruolo !== 'segretario';
    const mostraNumeroAlbo = utente.ruolo === 'medico';

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'modificaUtenteOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel" style="max-width: 500px;">
        <p class="hl-modal-title">Modifica ${escapeHtml(utente.nome)} ${escapeHtml(utente.cognome)}</p>
        <p class="hl-modal-sub">${ruoloLabelDi(utente.ruolo)} — lascia vuota la password per non cambiarla.</p>

        <form id="modificaUtenteForm">
          <div class="hl-form-grid">
            <div class="hl-form-field">
              <label for="muNome">Nome</label>
              <input type="text" id="muNome" value="${escapeHtml(utente.nome)}" required>
            </div>
            <div class="hl-form-field">
              <label for="muCognome">Cognome</label>
              <input type="text" id="muCognome" value="${escapeHtml(utente.cognome)}" required>
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="muEmail">Email</label>
              <input type="email" id="muEmail" value="${escapeHtml(utente.email)}" required>
            </div>
            <div class="hl-form-field">
              <label for="muTelefono">Telefono</label>
              <input type="tel" id="muTelefono" value="${escapeHtml(utente.telefono || '')}">
            </div>
            <div class="hl-form-field">
              <label for="muPassword">Nuova password</label>
              <input type="text" id="muPassword" placeholder="Lascia vuoto per non cambiare">
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="muSede">Sede</label>
              <select id="muSede"><option value="">Caricamento…</option></select>
            </div>
            ${mostraSpecializzazione ? `
              <div class="hl-form-field hl-form-full">
                <label for="muSpecializzazione">Specializzazione</label>
                <select id="muSpecializzazione"><option value="">Caricamento…</option></select>
              </div>
            ` : ''}
            ${mostraNumeroAlbo ? `
              <div class="hl-form-field hl-form-full">
                <label for="muNumeroAlbo">Numero albo</label>
                <input type="text" id="muNumeroAlbo" value="${escapeHtml(utente.numeroAlbo || '')}">
              </div>
            ` : ''}
          </div>

          <p class="hl-upload-error" id="modificaUtenteErrore"></p>

          <div class="hl-modal-actions">
            <button type="button" class="hl-btn-annulla-upload" id="modificaUtenteAnnullaBtn">Annulla</button>
            <button type="submit" class="hl-btn-upload" id="modificaUtenteConfermaBtn">Salva</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleGenerico('modificaUtenteOverlay');
    });
    document.getElementById('modificaUtenteAnnullaBtn')
      .addEventListener('click', () => chiudiModaleGenerico('modificaUtenteOverlay'));

    // Precompila sede/specializzazione: gli endpoint restituiscono solo id/nome,
    // quindi selezioniamo l'opzione il cui testo coincide col nome già noto
    // dal riepilogo utente (i nomi sono comunque univoci in questi elenchi).
    caricaSediInSelect('muSede').then(() => {
      const selectEl = document.getElementById('muSede');
      Array.from(selectEl.options).forEach(opt => {
        if (opt.textContent === utente.nomeSede) opt.selected = true;
      });
    });

    if (mostraSpecializzazione) {
      const tipoSpec = utente.ruolo === 'medico' ? 'medico' : 'tecnico';
      caricaSpecializzazioniInSelect('muSpecializzazione', tipoSpec).then(() => {
        const selectEl = document.getElementById('muSpecializzazione');
        Array.from(selectEl.options).forEach(opt => {
          if (opt.textContent === utente.nomeSpecializzazione) opt.selected = true;
        });
      });
    }

    document.getElementById('modificaUtenteForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById('modificaUtenteErrore');
      const btn = document.getElementById('modificaUtenteConfermaBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Salvataggio…';

      const sedeVal = document.getElementById('muSede').value;
      const specSelectEl = document.getElementById('muSpecializzazione');
      const numeroAlboEl = document.getElementById('muNumeroAlbo');

      const payload = {
        nome: document.getElementById('muNome').value.trim(),
        cognome: document.getElementById('muCognome').value.trim(),
        email: document.getElementById('muEmail').value.trim(),
        telefono: document.getElementById('muTelefono').value.trim(),
        nuovaPassword: document.getElementById('muPassword').value.trim() || null,
        idSede: sedeVal ? parseInt(sedeVal, 10) : null,
        idSpecializzazione: (specSelectEl && specSelectEl.value) ? parseInt(specSelectEl.value, 10) : null,
        numeroAlbo: numeroAlboEl ? numeroAlboEl.value.trim() : null,
        biografia: null
      };

      try {
        await axios.put(`${API_BASE_URL}/admin/utenti/${idUtente}`, payload);
        chiudiModaleGenerico('modificaUtenteOverlay');
        await caricaUtentiAdmin(
          document.getElementById('utentiRicerca')?.value || '',
          document.getElementById('utentiFiltroRuolo')?.value || ''
        );
      } catch (error) {
        btn.disabled = false;
        btn.textContent = 'Salva';
        errorEl.textContent = error.response?.data?.message || 'Salvataggio non riuscito. Riprova.';
      }
    });
  }

  // ===================== Catalogo servizi (RF-17) =====================

  let categorieAdminCache = [];

  // ---------- Categorie ----------

  async function caricaCategorieAdmin() {
    const wrapEl = document.getElementById('categorieWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';

    try {
      const res = await axios.get(`${API_BASE_URL}/admin/categorie`);
      categorieAdminCache = res.data;
      renderTabellaCategorieAdmin();
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare le categorie.</p>';
    }
  }

  function renderTabellaCategorieAdmin() {
    const wrapEl = document.getElementById('categorieWrap');

    if (!categorieAdminCache.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessuna categoria trovata.</p>';
      return;
    }

    wrapEl.innerHTML = `
      <table class="hl-refertare-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Slug</th>
            <th>Immagine</th>
            <th>Stato</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${categorieAdminCache.map(renderRigaCategoriaAdmin).join('')}
        </tbody>
      </table>
    `;

    wrapEl.querySelectorAll('.hl-btn-gestisci-prestazioni').forEach(btn => {
      btn.addEventListener('click', () => apriModaleGestionePrestazioni(
        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-nome')
      ));
    });
    wrapEl.querySelectorAll('.hl-btn-modifica-categoria').forEach(btn => {
      btn.addEventListener('click', () => apriModaleCategoria(parseInt(btn.getAttribute('data-id'), 10)));
    });
    wrapEl.querySelectorAll('.hl-btn-toggle-categoria').forEach(btn => {
      btn.addEventListener('click', () => toggleCategoriaAdmin(
        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-attivo') === 'true'
      ));
    });
  }

  function renderRigaCategoriaAdmin(c) {
    const badgeHtml = c.attivo
      ? `<span class="hl-badge-registrato"><i class="bi bi-check-circle-fill me-1"></i>Attiva</span>`
      : `<span class="hl-badge-annullata"><i class="bi bi-slash-circle me-1"></i>Sospesa</span>`;

    const immagineHtml = c.urlImmagine
      ? `<span class="hl-cell-mute" title="${escapeHtml(c.urlImmagine)}"><i class="bi bi-image me-1"></i>Sì</span>`
      : `<span class="hl-cell-mute">—</span>`;

    return `
      <tr>
        <td style="white-space: nowrap;">${escapeHtml(c.nome)}</td>
        <td class="hl-cell-mute">${escapeHtml(c.slug)}</td>
        <td>${immagineHtml}</td>
        <td>${badgeHtml}</td>
        <td class="hl-refertare-action-cell">
          <div class="hl-refertare-btn-group">
            <button type="button" class="hl-btn-sposta hl-btn-gestisci-prestazioni"
              data-id="${c.id}" data-nome="${escapeHtml(c.nome)}">Prestazioni</button>
            <button type="button" class="hl-btn-sposta hl-btn-modifica-categoria" data-id="${c.id}">Modifica</button>
            <button type="button" class="hl-btn-annulla-upload hl-btn-toggle-categoria"
              data-id="${c.id}" data-attivo="${c.attivo}">
              ${c.attivo ? 'Sospendi' : 'Riattiva'}
            </button>
          </div>
        </td>
      </tr>
    `;
  }

  async function toggleCategoriaAdmin(id, attivoAttuale) {
    const msg = attivoAttuale
      ? 'Confermi la sospensione di questa categoria? Tutte le prestazioni al suo interno smetteranno di essere prenotabili.'
      : 'Confermi la riattivazione di questa categoria?';
    if (!confirm(msg)) return;

    const azione = attivoAttuale ? 'sospendi' : 'riattiva';
    try {
      await axios.patch(`${API_BASE_URL}/admin/categorie/${id}/${azione}`);
      await caricaCategorieAdmin();
    } catch (error) {
      alert(error.response?.data?.message || 'Operazione non riuscita.');
    }
  }

  function apriModaleCategoria(idCategoria) {
    const categoria = idCategoria ? categorieAdminCache.find(c => c.id === idCategoria) : null;
    const isModifica = !!categoria;

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'categoriaOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel" style="max-width: 480px;">
        <p class="hl-modal-title">${isModifica ? 'Modifica categoria' : 'Nuova categoria'}</p>

        <form id="categoriaForm">
          <div class="hl-form-grid">
            <div class="hl-form-field hl-form-full">
              <label for="catNome">Nome</label>
              <input type="text" id="catNome" value="${isModifica ? escapeHtml(categoria.nome) : ''}" required>
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="catSlug">Slug (usato negli URL, es. "analisi")</label>
              <input type="text" id="catSlug" value="${isModifica ? escapeHtml(categoria.slug) : ''}" required>
            </div>
          </div>

          <p class="hl-upload-error" id="categoriaErrore"></p>

          <div class="hl-modal-actions">
            <button type="button" class="hl-btn-annulla-upload" id="categoriaAnnullaBtn">Annulla</button>
            <button type="submit" class="hl-btn-upload" id="categoriaConfermaBtn">${isModifica ? 'Salva' : 'Crea'}</button>
          </div>
        </form>

        ${isModifica ? `
          <hr style="margin: 1.4rem 0; border: none; border-top: 1px solid #e5edf1;">
          <p class="hl-modal-sub" style="margin-bottom: 0.6rem;">Immagine della categoria</p>
          ${categoria.urlImmagine
            ? `<img src="${API_BASE_URL}${categoria.urlImmagine}" alt=""
                 style="max-width: 100%; max-height: 120px; border-radius: 8px; display: block; margin-bottom: 0.7rem; object-fit: cover;">`
            : '<p class="hl-cell-mute" style="margin: 0 0 0.7rem;">Nessuna immagine caricata.</p>'}
          <input type="file" id="catImmagineFile" accept="image/jpeg,image/png,image/webp" class="hl-upload-input">
          <button type="button" class="hl-btn-sposta" id="catCaricaImmagineBtn" style="margin-top: 0.6rem;">Carica immagine</button>
          <p class="hl-upload-error" id="catImmagineErrore"></p>
        ` : `
          <p class="hl-cell-mute" style="margin-top: 1rem;">Potrai caricare un'immagine dopo aver creato la categoria.</p>
        `}
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => { if (e.target === overlay) chiudiModaleGenerico('categoriaOverlay'); });
    document.getElementById('categoriaAnnullaBtn').addEventListener('click', () => chiudiModaleGenerico('categoriaOverlay'));

    document.getElementById('categoriaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('categoriaErrore');
      const btn = document.getElementById('categoriaConfermaBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = isModifica ? 'Salvataggio…' : 'Creazione…';

      // Nota: il campo immagine si trova sotto, nella rispettiva sezione dedicata
      const payload = {
        nome: document.getElementById('catNome').value.trim(),
        slug: document.getElementById('catSlug').value.trim()
      };

      try {
        if (isModifica) {
          await axios.put(`${API_BASE_URL}/admin/categorie/${idCategoria}`, payload);
        } else {
          await axios.post(`${API_BASE_URL}/admin/categorie`, payload);
        }
        chiudiModaleGenerico('categoriaOverlay');
        await caricaCategorieAdmin();
      } catch (error) {
        btn.disabled = false;
        btn.textContent = isModifica ? 'Salva' : 'Crea';
        errorEl.textContent = error.response?.data?.message || 'Operazione non riuscita. Riprova.';
      }
    });

    if (isModifica) {
      document.getElementById('catCaricaImmagineBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('catImmagineFile');
        const errorEl = document.getElementById('catImmagineErrore');
        const btn = document.getElementById('catCaricaImmagineBtn');
        errorEl.textContent = '';

        if (!fileInput.files.length) {
          errorEl.textContent = 'Seleziona un file immagine (JPG, PNG o WEBP).';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Caricamento…';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
          await axios.post(`${API_BASE_URL}/admin/categorie/${idCategoria}/immagine`, formData);
          chiudiModaleGenerico('categoriaOverlay');
          await caricaCategorieAdmin();
        } catch (error) {
          btn.disabled = false;
          btn.textContent = 'Carica immagine';
          errorEl.textContent = error.response?.data?.message || 'Caricamento non riuscito. Riprova.';
        }
      });
    }
  }

  // ---------- Prestazioni dirette ----------

  async function caricaPrestazioniDiretteAdmin() {
    const wrapEl = document.getElementById('direttePrestazioniWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/prestazioni-dirette`, {
        params: { idCategoria: categoriaCorrenteGestione.id }
      });
      prestazioniDiretteCorrentiCache = res.data;
      renderTabellaPrestazioniDirette();

      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare le prestazioni.</p>';
    }
  }

  function renderTabellaPrestazioniDirette() {
    const wrapEl = document.getElementById('direttePrestazioniWrap');
    if (!prestazioniDiretteCorrentiCache.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessuna prestazione diretta in questa categoria.</p>';
      return;
    }

        <thead>
          <tr><th>Nome</th><th>Esecutore</th><th>Stato</th><th></th></tr>
        </thead>
        <tbody>${prestazioniDiretteCorrentiCache.map(renderRigaPrestazioneDiretta).join('')}</tbody>
      </table>

        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-nome')
      ));
    });
    wrapEl.querySelectorAll('.hl-btn-modifica-diretta').forEach(btn => {
      btn.addEventListener('click', () => apriModalePrestazioneDiretta(parseInt(btn.getAttribute('data-id'), 10)));
    });

      btn.addEventListener('click', () => toggleDirettaAdmin(
        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-attivo') === 'true'
      ));
    });

  async function toggleDirettaAdmin(id, attivoAttuale) {
    if (!confirm(attivoAttuale ? 'Confermi la sospensione?' : 'Confermi la riattivazione?')) return;
    const azione = attivoAttuale ? 'sospendi' : 'riattiva';
    try {
      await axios.patch(`${API_BASE_URL}/admin/prestazioni-dirette/${id}/${azione}`);
      await caricaPrestazioniDiretteAdmin();
    } catch (error) {
      alert(error.response?.data?.message || 'Operazione non riuscita.');
    }
  }

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'direttaOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel" style="max-width: 480px;">
        <p class="hl-modal-title">${isModifica ? 'Modifica prestazione diretta' : 'Nuova prestazione diretta'}</p>
        <p class="hl-modal-sub">${escapeHtml(categoriaCorrenteGestione.nome)}</p>

              <label for="dirNome">Nome</label>
              <input type="text" id="dirNome" value="${isModifica ? escapeHtml(prestazione.nome) : ''}" required>
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="dirTipoEsecutore">Eseguita da</label>

  // ---------- Prestazioni vincolate ----------

    const wrapEl = document.getElementById('previaVisitaPrestazioniWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';

  function renderTabellaPrestazioniPreviaVisita() {
    const wrapEl = document.getElementById('previaVisitaPrestazioniWrap');
    if (!prestazioniPreviaVisitaCorrentiCache.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessuna prestazione vincolata in questa categoria.</p>';
      return;

    wrapEl.innerHTML = `
      <table class="hl-refertare-table">

      btn.addEventListener('click', () => togglePreviaVisitaAdmin(
        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-attivo') === 'true'

  function renderRigaPrestazionePreviaVisita(p) {
    const esecutore = p.nomeSpecializzazioneMedico
      ? `Medico — ${escapeHtml(p.nomeSpecializzazioneMedico)}`
      : `Tecnico — ${escapeHtml(p.nomeSpecializzazioneTecnico)}`;

      ? `<span class="hl-badge-registrato">Attiva</span>`
      : `<span class="hl-badge-annullata">Sospesa</span>`;
    return `
      <tr>
        <td style="white-space: nowrap;">${escapeHtml(p.nome)}</td>
        <td class="hl-cell-mute">${escapeHtml(p.nomeVisitaPropedeutica)}</td>

          </div>

  async function togglePreviaVisitaAdmin(id, attivoAttuale) {
    if (!confirm(attivoAttuale ? 'Confermi la sospensione?' : 'Confermi la riattivazione?')) return;
    const azione = attivoAttuale ? 'sospendi' : 'riattiva';
    try {
      await axios.patch(`${API_BASE_URL}/admin/prestazioni-previa-visita/${id}/${azione}`);
      await caricaPrestazioniPreviaVisitaAdmin();

      alert(error.response?.data?.message || 'Operazione non riuscita.');
    }

            <div class="hl-form-field hl-form-full">

          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => { if (e.target === overlay) chiudiModaleGenerico('previaOverlay'); });

    // Menu "visita propedeutica": solo visite dirette eseguite da un Medico

    (async () => {

      try {

        selectEl.innerHTML = '<option value="">Seleziona…</option>' +
          res.data.map(v => `<option value="${v.id}">${escapeHtml(v.nome)} (${escapeHtml(v.nomeCategoria)})</option>`).join('');

      } catch (error) {

    const tipoSelect = document.getElementById('prevTipoEsecutore');

    async function ricaricaSpecializzazioni(preselezionaId) {
      const tipo = tipoSelect.value;
      if (!tipo) {
        specSelect.innerHTML = '<option value="">Seleziona prima "Eseguita da"…</option>';

      }
      await caricaSpecializzazioniInSelect('prevSpecializzazione', tipo);
      if (preselezionaId) specSelect.value = preselezionaId;

    document.getElementById('previaForm').addEventListener('submit', async (e) => {

      btn.disabled = true;

  // ---------- Modale "Parametri" (terzo livello — sotto-parametri della prestazione diretta) ----------

  let prestazioneCorrenteParametri = null;
  let parametriCorrentiCache = [];

  async function apriModaleParametri(idPrestazioneDiretta, nomePrestazione) {
    prestazioneCorrenteParametri = { id: idPrestazioneDiretta, nome: nomePrestazione };

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'parametriOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel" style="max-width: 480px;">
        <p class="hl-modal-title">Parametri — ${escapeHtml(nomePrestazione)}</p>
        <p class="hl-modal-sub">Le opzioni selezionabili dal paziente al momento della prenotazione.</p>

        <div class="hl-storico-filtri">
          <button type="button" class="hl-btn-nuovo-paziente" id="apriNuovoParametroBtn">
            <i class="bi bi-plus-lg me-1"></i>Nuovo parametro
          </button>
        </div>

        <div id="parametriWrap"></div>

        <div class="hl-modal-actions">
          <button type="button" class="hl-btn-annulla-upload" id="parametriChiudiBtn">Chiudi</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => { if (e.target === overlay) chiudiModaleGenerico('parametriOverlay'); });
    document.getElementById('parametriChiudiBtn').addEventListener('click', () => chiudiModaleGenerico('parametriOverlay'));
    document.getElementById('apriNuovoParametroBtn').addEventListener('click', () => apriFormParametro(null, null));

    await caricaParametriAdmin();
  }

  async function caricaParametriAdmin() {
    const wrapEl = document.getElementById('parametriWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/prestazioni-dirette/${prestazioneCorrenteParametri.id}/servizi`);
      parametriCorrentiCache = res.data;
      renderListaParametri();
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare i parametri.</p>';
    }
  }

  function renderListaParametri() {
    const wrapEl = document.getElementById('parametriWrap');
    if (!parametriCorrentiCache.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessun parametro configurato.</p>';
      return;
    }
    wrapEl.innerHTML = parametriCorrentiCache.map(s => `
      <div class="hl-risorsa-ferie-periodo" style="margin-bottom: 0.5rem;">
        <span>${escapeHtml(s.nome)} ${s.attivo ? '' : '<span class="hl-cell-mute">(sospeso)</span>'}</span>
        <div style="display: flex; gap: 0.4rem;">
          <button type="button" class="hl-btn-rimuovi-ferie hl-btn-modifica-parametro"
            data-id="${s.id}" data-nome="${escapeHtml(s.nome)}" title="Modifica">
            <i class="bi bi-pencil"></i>
          </button>
          <button type="button" class="hl-btn-rimuovi-ferie hl-btn-toggle-parametro"
            data-id="${s.id}" data-attivo="${s.attivo}" title="${s.attivo ? 'Sospendi' : 'Riattiva'}">
            <i class="bi ${s.attivo ? 'bi-slash-circle' : 'bi-arrow-counterclockwise'}"></i>
          </button>
        </div>
      </div>
    `).join('');

    wrapEl.querySelectorAll('.hl-btn-modifica-parametro').forEach(btn => {
      btn.addEventListener('click', () => apriFormParametro(
        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-nome')
      ));
    });
    wrapEl.querySelectorAll('.hl-btn-toggle-parametro').forEach(btn => {
      btn.addEventListener('click', () => toggleParametroAdmin(
        parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-attivo') === 'true'
      ));
    });
  }

  // Nota: qui usiamo un prompt() invece di un modale dedicato
  // Se in futuro i parametri avranno più campi, andrà
  // sostituito con un vero form.
  function apriFormParametro(idParametro, nomeAttuale) {
    const nuovoNome = prompt(
      idParametro ? 'Nuovo nome del parametro:' : 'Nome del nuovo parametro:',
      nomeAttuale || ''
    );
    if (!nuovoNome || !nuovoNome.trim()) return;
    salvaParametro(idParametro, nuovoNome.trim());
  }

  async function salvaParametro(idParametro, nome) {
    try {
      if (idParametro) {
        await axios.put(`${API_BASE_URL}/admin/servizi/${idParametro}`, { nome });
      } else {
        await axios.post(`${API_BASE_URL}/admin/prestazioni-dirette/${prestazioneCorrenteParametri.id}/servizi`, { nome });
      }
      await caricaParametriAdmin();
    } catch (error) {
      alert(error.response?.data?.message || 'Operazione non riuscita.');
    }
  }

  async function toggleParametroAdmin(id, attivoAttuale) {
    const azione = attivoAttuale ? 'sospendi' : 'riattiva';
    try {
      await axios.patch(`${API_BASE_URL}/admin/servizi/${id}/${azione}`);
      await caricaParametriAdmin();
    } catch (error) {
      alert(error.response?.data?.message || 'Operazione non riuscita.');
    }
  }

  let specializzazioniMedicoCache = [];
  let specializzazioniTecnicoCache = [];

  async function caricaSpecializzazioniAdmin() {
    await caricaListaSpecMedico();
    await caricaListaSpecTecnico();
    await caricaRuoliAdmin();
  }

  async function caricaListaSpecMedico() {
    const wrapEl = document.getElementById('specMedicoWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/specializzazioni-medico`);
      specializzazioniMedicoCache = res.data;
      renderListaSpecializzazioni(wrapEl, specializzazioniMedicoCache, 'medico');
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare.</p>';
    }
  }

  async function caricaListaSpecTecnico() {
    const wrapEl = document.getElementById('specTecnicoWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/specializzazioni-tecnico`);
      specializzazioniTecnicoCache = res.data;
      renderListaSpecializzazioni(wrapEl, specializzazioniTecnicoCache, 'tecnico');
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare.</p>';
    }
  }

  function renderListaSpecializzazioni(wrapEl, lista, tipo) {
    if (!lista.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessuna specializzazione.</p>';
      return;
    }
    wrapEl.innerHTML = lista.map(s => `
      <div class="hl-risorsa-ferie-periodo" style="margin-bottom: 0.5rem;">
        <span>${escapeHtml(s.nome)}</span>
        <button type="button" class="hl-btn-rimuovi-ferie hl-btn-modifica-spec"
          data-id="${s.id}" data-nome="${escapeHtml(s.nome)}" data-tipo="${tipo}" title="Rinomina">
          <i class="bi bi-pencil"></i>
        </button>
      </div>
    `).join('');

    wrapEl.querySelectorAll('.hl-btn-modifica-spec').forEach(btn => {
      btn.addEventListener('click', () => apriFormSpecializzazione(
        btn.getAttribute('data-tipo'), parseInt(btn.getAttribute('data-id'), 10), btn.getAttribute('data-nome')
      ));
    });
  }

  // Come per i parametri della prestazione: un solo campo (nome) non
  // giustifica un modale dedicato — prompt() è sufficiente e proporzionato.
  function apriFormSpecializzazione(tipo, id, nomeAttuale) {
    const nuovoNome = prompt(id ? 'Nuovo nome:' : 'Nome della nuova specializzazione:', nomeAttuale || '');
    if (!nuovoNome || !nuovoNome.trim()) return;
    salvaSpecializzazione(tipo, id, nuovoNome.trim());
  }

  async function salvaSpecializzazione(tipo, id, nome) {
    const endpoint = tipo === 'medico' ? 'specializzazioni-medico' : 'specializzazioni-tecnico';
    try {
      if (id) {
        await axios.put(`${API_BASE_URL}/admin/${endpoint}/${id}`, { nome });
      } else {
        await axios.post(`${API_BASE_URL}/admin/${endpoint}`, { nome });
      }
      if (tipo === 'medico') {
        await caricaListaSpecMedico();
      } else {
        await caricaListaSpecTecnico();
      }
    } catch (error) {
      alert(error.response?.data?.message || 'Operazione non riuscita.');
    }
  }

  async function caricaRuoliAdmin() {
    const wrapEl = document.getElementById('ruoliWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/ruoli`);
      if (!res.data.length) {
        wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessun ruolo trovato.</p>';
        return;
      }
      wrapEl.innerHTML = res.data.map(r => `
        <div class="hl-risorsa-ferie-periodo" style="margin-bottom: 0.5rem;">
          <span>${escapeHtml(r.nome)}</span>
        </div>
      `).join('');
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare i ruoli.</p>';
    }
  }

      <div class="hl-risorsa-ferie-card" style="margin-bottom: 0;" id="dashboardChartTemporale"></div>
    `;

    renderBarreOrizzontali('dashboardChartCategoria', 'Distribuzione per categoria', d.distribuzionePerCategoria, 'nomeCategoria');
    renderBarreOrizzontali('dashboardChartGenere', 'Distribuzione per genere', d.distribuzionePerGenere, 'sesso');
    renderAndamentoTemporale(d.andamentoTemporale);
  }

  // Aggiorna i 4 valori in alto (card totali/tasso + i due grafici a barre)
  // con i dati di un anno specifico
  function aggiornaCardSuperioriDashboard(d) {
    document.getElementById('valoreTotali').textContent = d.prenotazioniTotali;
    document.getElementById('valoreTasso').textContent = d.tassoCompletamento + '%';
    document.getElementById('dettaglioTasso').textContent =
      `${d.prenotazioniCompletate} completate su ${d.prenotazioniPassate} passate`;
    renderBarreOrizzontali('dashboardChartCategoria', 'Distribuzione per categoria', d.distribuzionePerCategoria, 'nomeCategoria');
    renderBarreOrizzontali('dashboardChartGenere', 'Distribuzione per genere', d.distribuzionePerGenere, 'sesso');
  }

  function renderBarreOrizzontali(containerId, titolo, dati, chiaveEtichetta) {
    const container = document.getElementById(containerId);

    if (!dati || !dati.length) {
      container.innerHTML = `
        <p class="hl-section-title" style="margin-top: 0;">${titolo}</p>
        <p class="hl-refertare-empty">Nessun dato disponibile.</p>
      `;
      return;
    }

    const massimo = Math.max(...dati.map(x => x.conteggio));

    container.innerHTML = `
      <p class="hl-section-title" style="margin-top: 0;">${titolo}</p>
      <div style="display: flex; flex-direction: column; gap: 0.65rem;">
        ${dati.map(x => `
          <div>
            <div style="display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 0.25rem;">
              <span>${escapeHtml(x[chiaveEtichetta])}</span>
              <span class="hl-cell-mute">${x.conteggio}</span>
            </div>
            <div style="background: #eef2f5; border-radius: 6px; height: 10px; overflow: hidden;">
              <div style="background: var(--hl-700); height: 100%; border-radius: 6px;
                width: ${massimo > 0 ? (x.conteggio / massimo * 100) : 0}%;"></div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Barre verticali per l'andamento temporale. asse "x" (mesi)
  let annoAndamentoTemporale = new Date().getFullYear();

  function renderAndamentoTemporale(dati) {
    const container = document.getElementById('dashboardChartTemporale');

    container.innerHTML = `
      <p class="hl-section-title" style="margin-top: 0;">Andamento temporale delle prenotazioni</p>
      <div style="overflow: hidden;">
        <div id="andamentoSlide"></div>
      </div>
      <div class="hl-andamento-anno-selettore">
        <button type="button" class="hl-andamento-anno-btn" id="annoPrevBtn" aria-label="Anno precedente">
          <i class="bi bi-chevron-left"></i>
        </button>
        <span class="hl-andamento-anno-label" id="annoLabel">${annoAndamentoTemporale}</span>
        <button type="button" class="hl-andamento-anno-btn" id="annoNextBtn" aria-label="Anno successivo">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    `;

    renderBarreAndamento(dati);

    document.getElementById('annoPrevBtn').addEventListener('click', () => cambiaAnnoAndamento(-1));
    document.getElementById('annoNextBtn').addEventListener('click', () => cambiaAnnoAndamento(1));
  }

  function renderBarreAndamento(dati) {
    const slideEl = document.getElementById('andamentoSlide');

    if (!dati || !dati.length) {
      slideEl.innerHTML = '<p class="hl-refertare-empty">Nessun dato disponibile.</p>';
      return;
    }

    const massimo = Math.max(...dati.map(x => x.conteggio));

    slideEl.innerHTML = `
      <div style="display: flex; align-items: flex-end; gap: 0.5rem; height: 140px; padding: 0 0.2rem;">
        ${dati.map(x => `
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end;">
            <span class="hl-cell-mute" style="font-size: 0.72rem; margin-bottom: 0.3rem;">${x.conteggio}</span>
            <div style="background: var(--hl-700); border-radius: 4px 4px 0 0; width: 100%;
              height: ${massimo > 0 ? (x.conteggio / massimo * 100) : 0}%; min-height: 2px; transition: height 0.3s ease;"></div>
            <span class="hl-cell-mute" style="font-size: 0.68rem; margin-top: 0.4rem; white-space: nowrap;">
              ${formattaMeseAnnoBreve(x.meseAnno)}
            </span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Scorrimento a carosello tra un anno e l'altro
  async function cambiaAnnoAndamento(direzione) {
    const slideEl = document.getElementById('andamentoSlide');
    const labelEl = document.getElementById('annoLabel');
    const prevBtn = document.getElementById('annoPrevBtn');
    const nextBtn = document.getElementById('annoNextBtn');
    const areaSuperiore = document.getElementById('dashboardAreaSuperiore');

    prevBtn.disabled = true;
    nextBtn.disabled = true;

    // Fase 1: elementi a schermo scompaiono verso il lato opposto a quello da cui entrerà il nuovo anno.
    // L'area superiore (card totali/tasso + i due grafici a barre) si dissolve
    slideEl.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    slideEl.style.transform = `translateX(${direzione > 0 ? '-28px' : '28px'})`;
    slideEl.style.opacity = '0';
    if (areaSuperiore) {
      areaSuperiore.style.transition = 'opacity 0.22s ease';
      areaSuperiore.style.opacity = '0.25';
    }

    await new Promise(risolvi => setTimeout(risolvi, 220));

    annoAndamentoTemporale += direzione;
    labelEl.textContent = annoAndamentoTemporale;

    try {
      //In una sola chiamata l'endpoint /admin/dashboard, con l'anno, restituisce
      // sia l'andamento mensile sia i 4 valori riassuntivi
      const res = await axios.get(`${API_BASE_URL}/admin/dashboard`, {
        params: { anno: annoAndamentoTemporale }
      });
      renderBarreAndamento(res.data.andamentoTemporale);
      aggiornaCardSuperioriDashboard(res.data);
    } catch (error) {
      document.getElementById('andamentoSlide').innerHTML =
        '<p class="hl-refertare-empty">Impossibile caricare i dati per questo anno.</p>';
    }

    if (areaSuperiore) areaSuperiore.style.opacity = '1';

    // Fase 2: il nuovo contenuto parte già posizionato fuori dalla vista (senza
    // transizione, altrimenti si vedrebbe "scattare")
    const nuovoSlideEl = document.getElementById('andamentoSlide');
    nuovoSlideEl.style.transition = 'none';
    nuovoSlideEl.style.transform = `translateX(${direzione > 0 ? '28px' : '-28px'})`;
    nuovoSlideEl.style.opacity = '0';

    void nuovoSlideEl.offsetWidth; // va a forzare il reflow. Senza questo, il browser salta lo stato di partenza

    nuovoSlideEl.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    nuovoSlideEl.style.transform = 'translateX(0)';
    nuovoSlideEl.style.opacity = '1';

    prevBtn.disabled = false;
    nextBtn.disabled = false;
  }

  function formattaMeseAnnoBreve(meseAnno) {
    const [anno, mese] = meseAnno.split('-');
    const mesiBrevi = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
    return `${mesiBrevi[parseInt(mese, 10) - 1]} ${anno.slice(2)}`;
  }

  // ===================== Sedi (RF-18) =====================

  let sediAdminCache = [];

  async function caricaSediAdminTab() {
    const selectEl = document.getElementById('sediAdminSelect');
    const selezionePrecedente = selectEl.value;

    try {
      const res = await axios.get(`${API_BASE_URL}/sedi`);
      sediAdminCache = res.data;
      selectEl.innerHTML = '<option value="">Seleziona una sede…</option>' +
        sediAdminCache.map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('');

      if (selezionePrecedente) {
        selectEl.value = selezionePrecedente;
        if (selectEl.value) await caricaServiziPerSedeAdmin(parseInt(selectEl.value, 10));
      }
    } catch (error) {
      selectEl.innerHTML = '<option value="">Impossibile caricare le sedi</option>';
    }
  }

  async function caricaServiziPerSedeAdmin(idSede) {
    const wrapEl = document.getElementById('sediAdminServiziWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';

    try {
      const res = await axios.get(`${API_BASE_URL}/admin/sedi/${idSede}/servizi`);
      renderChecklistServiziSede(idSede, res.data);
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare i servizi.</p>';
    }
  }

  function renderChecklistServiziSede(idSede, servizi) {
    const wrapEl = document.getElementById('sediAdminServiziWrap');

    if (!servizi.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessun servizio attivo nel catalogo.</p>';
      return;
    }

    // Raggruppati per categoria, per una lettura più comoda su elenchi lunghi
    const perCategoria = {};
    servizi.forEach(s => {
      if (!perCategoria[s.nomeCategoria]) perCategoria[s.nomeCategoria] = [];
      perCategoria[s.nomeCategoria].push(s);
    });

    wrapEl.innerHTML = Object.entries(perCategoria).map(([categoria, lista]) => `
      <div style="margin-top: 1.3rem;">
        <label class="hl-confirm-label" style="max-width: none; margin-bottom: 0.6rem; font-weight: 700; font-size: 0.86rem;">
          <input type="checkbox" class="hl-check-categoria-sede" data-categoria="${escapeHtml(categoria)}">
          ${escapeHtml(categoria)}
        </label>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.5rem 1rem;">
          ${lista.map(s => `
            <label class="hl-confirm-label" style="max-width: none; margin-bottom: 0;">
              <input type="checkbox" class="hl-check-servizio-sede"
                data-id="${s.id}" data-tipo="${s.tipo}" data-categoria="${escapeHtml(categoria)}"
                ${s.disponibileInSede ? 'checked' : ''}>
              ${escapeHtml(s.nome)}
              <span class="hl-cell-mute">(${s.tipo === 'diretta' ? 'diretto' : 'vincolato'})</span>
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');

    // Imposto lo stato del checkbox delle categorie in base a quanti figli sono spuntati:
    // tutti -> spuntato, nessuno -> vuoto, alcuni -> il trattino.
    function aggiornaStatoCheckboxCategoria(categoria) {
      const checkboxCategoria = wrapEl.querySelector(
        `.hl-check-categoria-sede[data-categoria="${CSS.escape(categoria)}"]`
      );
      const checkboxFigli = wrapEl.querySelectorAll(
        `.hl-check-servizio-sede[data-categoria="${CSS.escape(categoria)}"]`
      );
      const totale = checkboxFigli.length;
      const spuntati = Array.from(checkboxFigli).filter(f => f.checked).length;

      if (spuntati === 0) {
        checkboxCategoria.checked = false;
        checkboxCategoria.indeterminate = false;
      } else if (spuntati === totale) {
        checkboxCategoria.checked = true;
        checkboxCategoria.indeterminate = false;
      } else {
        checkboxCategoria.checked = false;
        checkboxCategoria.indeterminate = true;
      }
    }

    // Stato iniziale, appena renderizzato
    wrapEl.querySelectorAll('.hl-check-categoria-sede').forEach(cb => {
      aggiornaStatoCheckboxCategoria(cb.getAttribute('data-categoria'));
    });

    // Checkbox del singolo servizio
    wrapEl.querySelectorAll('.hl-check-servizio-sede').forEach(cb => {
      cb.addEventListener('change', async (e) => {
        const idServizio = parseInt(e.target.getAttribute('data-id'), 10);
        const tipo = e.target.getAttribute('data-tipo');
        const categoria = e.target.getAttribute('data-categoria');
        const attiva = e.target.checked;

        e.target.disabled = true;
        try {
          if (attiva) {
            await axios.post(`${API_BASE_URL}/admin/sedi/${idSede}/servizi/${tipo}/${idServizio}`);
          } else {
            await axios.delete(`${API_BASE_URL}/admin/sedi/${idSede}/servizi/${tipo}/${idServizio}`);
          }
        } catch (error) {
          alert(error.response?.data?.message || 'Operazione non riuscita.');
          e.target.checked = !attiva; // ripristina lo stato precedente in caso di errore
        } finally {
          e.target.disabled = false;
          aggiornaStatoCheckboxCategoria(categoria);
        }
      });
    });

    // Checkbox di categoria: togie tutti i servizi di una det. categoria da una det. sede con un solo click
    wrapEl.querySelectorAll('.hl-check-categoria-sede').forEach(cb => {
      cb.addEventListener('change', async (e) => {
        const categoria = e.target.getAttribute('data-categoria');
        const attiva = e.target.checked;
        const checkboxFigli = wrapEl.querySelectorAll(
          `.hl-check-servizio-sede[data-categoria="${CSS.escape(categoria)}"]`
        );

        e.target.disabled = true;
        checkboxFigli.forEach(figlio => { figlio.disabled = true; });

        try {
          await Promise.all(Array.from(checkboxFigli).map(async figlio => {
            // Salta i servizi già nello stato desiderato — evita chiamate inutili
            if (figlio.checked === attiva) return;
            const idServizio = parseInt(figlio.getAttribute('data-id'), 10);
            const tipo = figlio.getAttribute('data-tipo');
            if (attiva) {
              await axios.post(`${API_BASE_URL}/admin/sedi/${idSede}/servizi/${tipo}/${idServizio}`);
            } else {
              await axios.delete(`${API_BASE_URL}/admin/sedi/${idSede}/servizi/${tipo}/${idServizio}`);
            }
            figlio.checked = attiva;
          }));
        } catch (error) {
          alert(error.response?.data?.message || 'Operazione non riuscita su uno o più servizi. Ricarico lo stato reale.');
          // Se vi è un errore, ricarico lo stato dei servizi dal DB per evitare che la UI mostri uno stato incoerente
          await caricaServiziPerSedeAdmin(idSede);
          return;
        } finally {
          checkboxFigli.forEach(figlio => { figlio.disabled = false; });
          e.target.disabled = false;
        }

        aggiornaStatoCheckboxCategoria(categoria);
      });
    });
  }

  function apriModaleSede(sede) {
    const isModifica = !!sede;

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'sedeOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel" style="max-width: 420px;">
        <p class="hl-modal-title">${isModifica ? 'Modifica sede' : 'Nuova sede'}</p>

        <form id="sedeForm">
          <div class="hl-form-grid">
            <div class="hl-form-field hl-form-full">
              <label for="sedeNome">Nome</label>
              <input type="text" id="sedeNome" value="${isModifica ? escapeHtml(sede.nome) : ''}" required>
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="sedeIndirizzo">Indirizzo</label>
              <input type="text" id="sedeIndirizzo" value="${isModifica ? escapeHtml(sede.indirizzo || '') : ''}">
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="sedeOrario">Orario di apertura</label>
              <input type="text" id="sedeOrario" value="${isModifica ? escapeHtml(sede.orario || '') : ''}"
                placeholder="es. Lun-Ven 8:00-18:00, Sab 8:00-13:00">
            </div>
            <div class="hl-form-field hl-form-full">
              <label for="sedeTelefono">Telefono</label>
              <input type="text" id="sedeTelefono" value="${isModifica ? escapeHtml(sede.telefono || '') : ''}"
                placeholder="es. +39 06 1234567">
            </div>
          </div>

          <p class="hl-upload-error" id="sedeErrore"></p>

          <div class="hl-modal-actions">
            <button type="button" class="hl-btn-annulla-upload" id="sedeAnnullaBtn">Annulla</button>
            <button type="submit" class="hl-btn-upload" id="sedeConfermaBtn">${isModifica ? 'Salva' : 'Crea'}</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => { if (e.target === overlay) chiudiModaleGenerico('sedeOverlay'); });
    document.getElementById('sedeAnnullaBtn').addEventListener('click', () => chiudiModaleGenerico('sedeOverlay'));

    document.getElementById('sedeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('sedeErrore');
      const btn = document.getElementById('sedeConfermaBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = isModifica ? 'Salvataggio…' : 'Creazione…';

      const payload = {
        nome: document.getElementById('sedeNome').value.trim(),
        indirizzo: document.getElementById('sedeIndirizzo').value.trim() || null,
        orario: document.getElementById('sedeOrario').value.trim() || null,
        telefono: document.getElementById('sedeTelefono').value.trim() || null
      };

      try {
        if (isModifica) {
          await axios.put(`${API_BASE_URL}/admin/sedi/${sede.id}`, payload);
        } else {
          await axios.post(`${API_BASE_URL}/admin/sedi`, payload);
        }
        chiudiModaleGenerico('sedeOverlay');
        await caricaSediAdminTab();
      } catch (error) {
        btn.disabled = false;
        btn.textContent = isModifica ? 'Salva' : 'Crea';
        errorEl.textContent = error.response?.data?.message || 'Operazione non riuscita. Riprova.';
      }
    });
  }

  init();
</script>

</body>
