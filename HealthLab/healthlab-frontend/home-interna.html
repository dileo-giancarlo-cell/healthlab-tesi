<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthLab — La tua area</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --hl-white: #ffffff;
    --hl-900: #0a3a57;
    --hl-700: #0f6690;
    --hl-500: #1f8fc4;
    --hl-050: #eaf5fb;
    --hl-red: #c23b3b;
    --hl-green: #1f8f5c;
    --hl-green-bg: #e9f7f0;
    --hl-ink: #16242c;
    --hl-mute: #5c6b74;
    --font-display: "Manrope", system-ui, sans-serif;
    --font-body: "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font-body); color: var(--hl-ink); background: #f7fafc; margin: 0; padding-top: 68px; }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.01em; }
  a { text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .hl-topbar {
    background: #fff; border-bottom: 1px solid #e5edf1; padding: 0.8rem 0;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  }
  .hl-brand { display: flex; align-items: center; gap: 0.6rem; color: var(--hl-900); }
  .hl-brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--hl-700);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hl-brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
  .hl-logout { color: var(--hl-mute); font-size: 0.88rem; font-weight: 600; }
  .hl-logout:hover { color: var(--hl-red); }

  .hl-mobile-menu-btn {
    display: none; background: none; border: none; color: var(--hl-900); font-size: 1.3rem;
    padding: 0.25rem 0.4rem; margin-left: 0.6rem;
  }
  @media (max-width: 767.98px) {
    .hl-mobile-menu-btn { display: inline-flex; align-items: center; }
  }
  .hl-mobile-menu { display: none; flex-direction: column; border-top: 1px solid #e5edf1; background: #fff; }
  .hl-mobile-menu.open { display: flex; }
  .hl-mobile-menu-link { padding: 0.85rem 1.2rem; color: var(--hl-ink); font-weight: 600; font-size: 0.92rem; border-bottom: 1px solid #f0f3f5; }
  .hl-mobile-menu-link:last-child { border-bottom: none; }
  .hl-mobile-menu-link.active { color: var(--hl-700); background: var(--hl-050); font-weight: 700; }

  .hl-topnav { gap: 0.2rem; }
  .hl-topnav-link { color: var(--hl-ink); font-weight: 600; font-size: 0.88rem; padding: 0.4rem 0.9rem; border-radius: 999px; }
  .hl-topnav-link:hover { color: var(--hl-700); }
  .hl-topnav-link.active { color: var(--hl-700); background: var(--hl-050); font-weight: 700; }

  .hl-contatti-footer { background: #fff; border-top: 1px solid #e5edf1; margin-top: 2.5rem; padding: 2rem 0 2.5rem; }
  .hl-contatti-inner { max-width: 900px; margin: 0 auto; padding: 0 1rem; }
  .hl-contatti-titolo { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--hl-900); margin-bottom: 1rem; }
  .hl-contatti-sedi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.8rem; }
  .hl-contatti-sede-card {
    background: var(--hl-050); border-radius: 10px; padding: 0.9rem 1.1rem;
    transition: transform 0.15s ease;
  }
  .hl-contatti-sede-card:hover { transform: translateY(-1px); }
  .hl-contatti-sede-nome { font-weight: 700; color: var(--hl-900); margin: 0 0 0.35rem; }
  .hl-contatti-sede-riga { font-size: 0.85rem; color: var(--hl-mute); margin: 0.15rem 0; }
  .hl-contatti-email { margin-top: 1.2rem; font-weight: 600; color: var(--hl-700); font-size: 0.9rem; }

  .hl-content { max-width: 900px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  .hl-greeting { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; color: var(--hl-900); margin-bottom: 0.3rem; }
  .hl-greeting-sub { color: var(--hl-mute); margin-bottom: 2rem; }

  @keyframes hl-fade-in-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Highlights ---------- */
  .hl-highlights { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .hl-highlight-card {
    flex: 1; min-width: 240px; background: #fff; border: 1px solid #edf1f4; border-radius: 14px;
    padding: 1.2rem 1.3rem; display: flex; align-items: center; gap: 1rem;
    box-shadow: 0 1px 2px rgba(10,58,87,0.04), 0 10px 26px -20px rgba(10,58,87,0.22);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: hl-fade-in-up 0.4s ease both;
  }
  .hl-highlight-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(10,58,87,0.06), 0 16px 34px -18px rgba(10,58,87,0.26); }
  .hl-highlight-icon {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(155deg, var(--hl-050) 0%, #dcedf7 100%); color: var(--hl-700);
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
  }
  .hl-highlight-card h3 { font-size: 0.95rem; font-weight: 700; margin: 0 0 0.15rem; }
  .hl-highlight-card p { font-size: 0.85rem; color: var(--hl-mute); margin: 0; }
  .hl-highlight-empty { color: var(--hl-mute); font-size: 0.85rem; }

  /* ---------- Quick actions ---------- */
  .hl-quick-title { font-size: 1rem; font-weight: 700; color: var(--hl-900); margin-bottom: 1rem; }
  .hl-quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
  .hl-quick-card {
    background: #fff; border: 1px solid #e5edf1; border-radius: 14px; padding: 1.4rem;
    display: flex; flex-direction: column; gap: 0.6rem; transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .hl-quick-card:hover { box-shadow: 0 12px 28px -18px rgba(10,58,87,0.35); transform: translateY(-2px); }
  .hl-quick-icon {
    width: 42px; height: 42px; border-radius: 10px; background: var(--hl-700); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .hl-quick-card h3 { font-size: 0.95rem; font-weight: 700; margin: 0; color: var(--hl-ink); }
  .hl-quick-card p { font-size: 0.82rem; color: var(--hl-mute); margin: 0; }

  /* ---------- Agenda Tecnico: calendario ---------- */
  .hl-calendar-card {
    background: #fff; border: 1px solid #e5edf1; border-radius: 16px; padding: 1rem 1.1rem;
    margin-bottom: 2rem;
  }
  .hl-calendar-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem;
  }
  .hl-calendar-month-label {
    font-family: var(--font-display); font-weight: 800; font-size: 0.98rem; color: var(--hl-900);
    text-transform: capitalize;
  }
  .hl-calendar-nav-btn {
    width: 28px; height: 28px; border-radius: 999px; border: 1px solid #e5edf1; background: #fff;
    color: var(--hl-700); display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; transition: background 0.15s ease;
  }
  .hl-calendar-nav-btn:hover { background: var(--hl-050); }

  .hl-calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.2rem;
  }
  .hl-calendar-weekday {
    text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--hl-mute);
    text-transform: uppercase; padding-bottom: 0.25rem;
  }
  .hl-calendar-day {
    height: 34px; border-radius: 8px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
    color: var(--hl-ink); cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
    position: relative;
  }
  .hl-calendar-day:hover { background: var(--hl-050); }
  .hl-calendar-day.hl-day-empty { cursor: default; background: transparent !important; }
  .hl-calendar-day.hl-day-has-prenotazioni {
    background: var(--hl-050); color: var(--hl-700); font-weight: 700;
  }
  .hl-calendar-day.hl-day-today { box-shadow: inset 0 0 0 1.5px var(--hl-500); }
  .hl-calendar-day.hl-day-selected { background: var(--hl-700); color: #fff; }

  .hl-calendar-day-badge {
    position: absolute; bottom: 2px; right: 3px; font-size: 0.56rem; font-weight: 800;
    color: var(--hl-red); line-height: 1; pointer-events: none;
  }
  .hl-calendar-day.hl-day-selected .hl-calendar-day-badge { color: #ffc2c2; }

  .hl-calendar-detail { margin-top: 1rem; border-top: 1px solid #e5edf1; padding-top: 1rem; }
  .hl-calendar-detail-title {
    font-size: 0.88rem; font-weight: 700; color: var(--hl-900); margin-bottom: 0.9rem;
  }

  .hl-agenda-list { display: flex; flex-direction: column; gap: 0.8rem; }
  .hl-agenda-card {
    background: #fff; border: 1px solid #e5edf1; border-radius: 14px; padding: 1.1rem 1.3rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  .hl-agenda-card-main { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 220px; }
  .hl-agenda-time {
    font-family: var(--font-display); font-weight: 800; font-size: 0.95rem; color: var(--hl-700);
    background: var(--hl-050); border-radius: 10px; padding: 0.4rem 0.65rem; flex-shrink: 0; min-width: 58px;
    text-align: center;
  }
  .hl-agenda-card-main h3 { font-size: 0.92rem; font-weight: 700; margin: 0 0 0.1rem; color: var(--hl-ink); }
  .hl-agenda-card-main p { font-size: 0.84rem; color: var(--hl-mute); margin: 0; }

  .hl-agenda-card-action { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
  .hl-btn-sposta {
    background: transparent; border: 1px solid #d8e0e5; color: var(--hl-700); font-size: 0.78rem;
    font-weight: 600; padding: 0.3rem 0.7rem; border-radius: 999px;
  }
  .hl-btn-sposta:hover { background: var(--hl-050); }

  /* ---------- Modale "Sposta prenotazione" ---------- */
  .hl-modal-overlay {
    position: fixed; inset: 0; background: rgba(10,20,30,0.45); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .hl-modal-panel {
    background: #fff; border-radius: 18px; padding: 1.3rem 1.4rem; width: 100%; max-width: 360px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px -20px rgba(10,58,87,0.5);
  }
  .hl-modal-title { font-size: 1rem; font-weight: 800; color: var(--hl-900); margin-bottom: 0.2rem; }
  .hl-modal-sub { font-size: 0.82rem; color: var(--hl-mute); margin-bottom: 1rem; }
  .hl-modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.2rem; }

  .hl-calendar-day.hl-day-disabled { color: #c7d0d5; cursor: not-allowed; }

  .hl-slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.9rem; }
  .hl-slot-btn {
    border: 1px solid #d8e0e5; background: #fff; border-radius: 8px; padding: 0.45rem 0.3rem;
    font-size: 0.78rem; color: var(--hl-ink); cursor: pointer; transition: background 0.15s ease;
  }
  .hl-slot-btn:hover { background: var(--hl-050); }
  .hl-slot-btn.hl-slot-selected { background: var(--hl-700); color: #fff; border-color: var(--hl-700); }
  .hl-slot-btn:disabled {
    background: #f2f5f7; color: #b7c2c8; cursor: not-allowed; border-color: #eef2f5;
  }
  .hl-slot-btn:disabled:hover { background: #f2f5f7; }

  .hl-sposta-error { color: var(--hl-red); font-size: 0.78rem; margin: 0.6rem 0 0; text-align: right; }

  /* ---------- Selezione a intervallo (calendario ferie) ---------- */
  .hl-calendar-day.hl-day-range-endpoint { background: var(--hl-700); color: #fff; }
  .hl-calendar-day.hl-day-in-range { background: var(--hl-050); color: var(--hl-700); }

  /* ---------- Tab Ferie ---------- */
  .hl-risorsa-ferie-card {
    background: #fff; border: 1px solid #e5edf1; border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 0.9rem;
  }
  .hl-risorsa-ferie-header {
    display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin-bottom: 0.8rem; flex-wrap: wrap;
  }
  .hl-risorsa-ferie-header h3 { font-size: 0.92rem; font-weight: 700; margin: 0 0 0.25rem; color: var(--hl-ink); }
  .hl-risorsa-ferie-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .hl-risorsa-ferie-periodo {
    display: flex; align-items: center; justify-content: space-between; background: #fbfdfe;
    border: 1px solid #eef2f5; border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.84rem;
  }
  .hl-btn-rimuovi-ferie {
    background: transparent; border: none; color: var(--hl-red); cursor: pointer; font-size: 0.9rem; padding: 0.1rem 0.3rem;
  }
  .hl-btn-rimuovi-ferie:hover { color: #8a1f1f; }
  .hl-upload-form { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
  .hl-upload-input {
    font-size: 0.8rem; padding: 0.35rem 0.6rem; border: 1px solid #d8e0e5; border-radius: 8px;
    max-width: 200px;
  }
  .hl-btn-upload {
    background: var(--hl-700); border: none; color: #fff; font-size: 0.82rem; font-weight: 700;
    padding: 0.4rem 0.9rem; border-radius: 999px; white-space: nowrap; transition: background 0.15s ease;
  }
  .hl-btn-upload:hover { background: var(--hl-900); }
  .hl-btn-upload:disabled { opacity: 0.65; }

  .hl-badge-done {
    background: var(--hl-green-bg); color: var(--hl-green); font-size: 0.82rem; font-weight: 700;
    padding: 0.4rem 0.8rem; border-radius: 999px; display: inline-flex; align-items: center;
  }
  .hl-badge-non-completata {
    background: #fdecec; color: var(--hl-red); font-size: 0.82rem; font-weight: 700;
    padding: 0.4rem 0.8rem; border-radius: 999px; display: inline-flex; align-items: center;
    cursor: help;
  }
  .hl-badge-annullata {
    background: #eef2f5; color: var(--hl-mute); font-size: 0.82rem; font-weight: 700;
    padding: 0.4rem 0.8rem; border-radius: 999px; display: inline-flex; align-items: center;
  }
  .hl-badge-svolta {
    background: var(--hl-050); color: var(--hl-700); font-size: 0.82rem; font-weight: 700;
    padding: 0.4rem 0.8rem; border-radius: 999px; display: inline-flex; align-items: center;
  }
  .hl-badge-da-gestire {
    background: #fff4e5; color: #b6690a; font-size: 0.82rem; font-weight: 700;
    padding: 0.4rem 0.8rem; border-radius: 999px; display: inline-flex; align-items: center;
  }

  /* ---------- Tab della sezione Segretario ---------- */
  .hl-tab-bar {
    display: flex; gap: 0.3rem; border-bottom: 1px solid #e5edf1; margin-bottom: 1.5rem;
    overflow-x: auto;
  }
  .hl-tab-btn {
    background: transparent; border: none; padding: 0.7rem 1.1rem; font-size: 0.88rem; font-weight: 600;
    color: var(--hl-mute); border-bottom: 2px solid transparent; white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .hl-tab-btn:hover { color: var(--hl-700); }
  .hl-tab-btn.active { color: var(--hl-700); border-bottom-color: var(--hl-700); }
  .hl-tab-panel { display: none; }
  .hl-tab-panel.active { display: block; }

  .hl-badge-registrato {
    background: var(--hl-green-bg); color: var(--hl-green); font-size: 0.78rem; font-weight: 700;
    padding: 0.3rem 0.65rem; border-radius: 999px; display: inline-flex; align-items: center;
  }
  .hl-badge-da-completare {
    background: #fff4e5; color: #b6690a; font-size: 0.78rem; font-weight: 700;
    padding: 0.3rem 0.65rem; border-radius: 999px; display: inline-flex; align-items: center;
  }
  .hl-btn-nuovo-paziente {
    background: var(--hl-700); border: none; color: #fff; font-size: 0.86rem; font-weight: 700;
    padding: 0.55rem 1.1rem; border-radius: 999px; white-space: nowrap; transition: background 0.15s ease;
  }
  .hl-btn-nuovo-paziente:hover { background: var(--hl-900); }

  .hl-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 0.9rem; }
  .hl-form-grid .hl-form-full { grid-column: 1 / -1; }
  .hl-form-field label {
    display: block; font-size: 0.78rem; font-weight: 600; color: var(--hl-ink); margin-bottom: 0.25rem;
  }
  .hl-form-field input, .hl-form-field select {
    width: 100%; font-size: 0.86rem; padding: 0.5rem 0.7rem; border: 1px solid #d8e0e5; border-radius: 8px;
  }

  /* ---------- Popup "Prenota per conto" (Segretario) ---------- */
  .hl-service-item {
    background: #fbfdfe; border: 1px solid #e5edf1; border-radius: 12px;
    margin-bottom: 0.8rem; overflow: hidden;
  }
  .hl-service-item:last-child { margin-bottom: 0; }
  .hl-service-header {
    padding: 0.9rem 1.1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .hl-service-header h3 { font-size: 0.92rem; font-weight: 700; margin: 0; }
  .hl-service-title-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .hl-service-tag {
    font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; display: inline-block;
  }
  .hl-tag-diretto { background: #e3f5ea; color: #1c7a4a; }
  .hl-tag-visita { background: #fdecec; color: var(--hl-red); }
  .hl-service-header .chevron { transition: transform 0.15s ease; color: var(--hl-mute); }
  .hl-service-item.open .chevron { transform: rotate(180deg); }
  .hl-service-detail { display: none; padding: 0 1.1rem 1.1rem; border-top: 1px solid #eef2f5; }
  .hl-service-item.open .hl-service-detail { display: block; padding-top: 0.9rem; }

  .hl-form-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.8rem; }

  .hl-params-label { font-size: 0.78rem; font-weight: 600; color: var(--hl-mute); margin-bottom: 0.4rem; }
  .hl-params-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.3rem; margin-bottom: 0.9rem;
  }
  .hl-param-check { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }

  .hl-slots-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
    gap: 0.4rem; margin: 0.6rem 0 0.9rem;
  }
  .hl-slot {
    padding: 0.4rem 0.2rem; border: 1px solid #d8e0e5; border-radius: 8px; background: #fff;
    font-size: 0.78rem; font-weight: 600; color: var(--hl-ink);
  }
  .hl-slot:hover:not(.occupied) { border-color: var(--hl-700); }
  .hl-slot.selected { background: var(--hl-700); color: #fff; border-color: var(--hl-700); }
  .hl-slot.occupied { background: #eef1f3; color: #b0b8bd; cursor: not-allowed; text-decoration: line-through; }

  .hl-alert-success { background: #e3f5ea; color: #1c7a4a; border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 0.84rem; margin-top: 0.7rem; }
  .hl-alert-error { background: #fdecec; color: var(--hl-red); border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 0.84rem; margin-bottom: 0.7rem; margin-top: 0.7rem; }
  .hl-upload-error { color: var(--hl-red); font-size: 0.78rem; margin: 0.3rem 0 0; text-align: left; }

  /* ---------- Tabella "Da refertare" ---------- */
  .hl-section-title {
    font-size: 1rem; font-weight: 700; color: var(--hl-900); margin-bottom: 0.3rem;
  }
  .hl-section-sub { color: var(--hl-mute); font-size: 0.85rem; margin-bottom: 1rem; }

  .hl-andamento-anno-selettore {
    display: flex; align-items: center; justify-content: center; gap: 1.1rem;
    margin-top: 1.1rem; padding-top: 0.9rem; border-top: 1px solid #f0f3f5;
  }
  .hl-andamento-anno-btn {
    background: var(--hl-050); border: none; color: var(--hl-700);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
    transition: background 0.15s ease;
  }
  .hl-andamento-anno-btn:hover { background: #dcedf7; }
  .hl-andamento-anno-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hl-andamento-anno-label {
    font-family: var(--font-display); font-weight: 800; font-size: 1rem; color: var(--hl-900);
    min-width: 3.2rem; text-align: center;
  }

  /* ---------- Cornici "Specializzazioni Medico/Tecnico" ---------- */
  .hl-spec-box {

  .hl-storico-select {
    font-size: 0.86rem; padding: 0.55rem 0.8rem; border: 1px solid #d8e0e5; border-radius: 8px;
    background: #fff; color: var(--hl-ink);
  }

  .hl-storico-filtri { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .hl-storico-search {
    flex: 1; min-width: 200px; border: 1px solid #d8e0e5; border-radius: 8px;

  .hl-storico-search:focus {

</head>
<body>

<div class="hl-topbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="home-interna.html" class="hl-brand">
      <span class="hl-brand-mark">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13h4l2-7 3 14 3-10 2 3h6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="hl-brand-name">HealthLab</span>
    </a>
    <nav class="hl-topnav d-none d-md-flex align-items-center" id="topNav">
      <!-- Popolata dinamicamente in base al ruolo, vedi renderNav() -->
    </nav>
    <div class="d-flex align-items-center">
      <a href="#" id="logoutLink" class="hl-logout"><i class="bi bi-box-arrow-right me-1"></i>Esci</a>
      <button type="button" class="hl-mobile-menu-btn" id="mobileMenuBtn" aria-label="Apri menu" style="display: none;">
        <i class="bi bi-list"></i>
      </button>
    </div>
  </div>
  <div class="hl-mobile-menu" id="mobileMenu"></div>
</div>

<div class="hl-content" id="content">
  <p class="hl-greeting">Caricamento…</p>
</div>

<footer class="hl-contatti-footer" id="contattiFooter" style="display: none;">
  <div class="hl-contatti-inner">
    <p class="hl-contatti-titolo">Contatti</p>
    <div id="contattiSediWrap" class="hl-contatti-sedi-grid">
      <p class="hl-refertare-empty">Caricamento sedi…</p>
    </div>
    <p class="hl-contatti-email"><i class="bi bi-envelope me-2"></i>info@healthlab.it</p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script>
  const API_BASE_URL = 'http://localhost:8080/api';

  const token = localStorage.getItem('healthlab_token');
  const ruolo = localStorage.getItem('healthlab_ruolo');
  if (!token) {
    window.location.href = 'login.html';
  }
  axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('healthlab_token');
    localStorage.removeItem('healthlab_ruolo');
    localStorage.removeItem('healthlab_id_utente');
    localStorage.removeItem('healthlab_nome');
    window.location.href = 'login.html';
  });

  const contentEl = document.getElementById('content');

  // Link della navbar in base al ruolo. Il paziente ha più voci, gli altri ruoli hanno solo questa pagina.
  const NAV_LINKS_PER_RUOLO = {
    paziente: [
      { href: 'home-interna.html', label: 'Home' },
      { href: 'prenota.html', label: 'Prenota' },
      { href: 'le-mie-prenotazioni.html', label: 'Le mie prenotazioni' },
      { href: 'referti.html', label: 'Referti' },
      { href: 'profilo.html', label: 'Mio profilo' },
    ],
    tecnico: [
    ],
    segretario: [
    ],
    medico: [
    ],
    amministratore: [
    ],
  };

  function renderNav() {
    const navEl = document.getElementById('topNav');
    const mobileNavEl = document.getElementById('mobileMenu');
    const mobileBtnEl = document.getElementById('mobileMenuBtn');
    const links = NAV_LINKS_PER_RUOLO[ruolo] || [];

    navEl.innerHTML = links.map(l => `<a href="${l.href}" class="hl-topnav-link">${l.label}</a>`).join('');
    mobileNavEl.innerHTML = links.map(l => `<a href="${l.href}" class="hl-mobile-menu-link">${l.label}</a>`).join('');

    // Niente hamburger se non c'è nulla da mostrarci dentro (Admin/Medico/
    // Segretario/Tecnico hanno solo questa pagina, non serve un menu vuoto).
    mobileBtnEl.style.display = links.length ? '' : 'none';

    const currentPage = window.location.pathname.split('/').pop();
    document.querySelectorAll('.hl-topnav-link, .hl-mobile-menu-link').forEach(link => {
      if (link.getAttribute('href') === currentPage) link.classList.add('active');
    });
  }

  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.toggle('open');
  });

  async function caricaContattiFooter() {
    const wrapEl = document.getElementById('contattiSediWrap');
    try {
      const res = await axios.get(`${API_BASE_URL}/sedi`);
      const sedi = res.data;

      if (!sedi.length) {
        wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessuna sede disponibile al momento.</p>';
        return;
      }

      wrapEl.innerHTML = sedi.map(s => `
        <div class="hl-contatti-sede-card">
          <p class="hl-contatti-sede-nome">${escapeHtml(s.nome)}</p>
          ${s.indirizzo ? `<p class="hl-contatti-sede-riga"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(s.indirizzo)}</p>` : ''}
          ${s.orario ? `<p class="hl-contatti-sede-riga"><i class="bi bi-clock me-1"></i>${escapeHtml(s.orario)}</p>` : ''}
          ${s.telefono ? `<p class="hl-contatti-sede-riga"><i class="bi bi-telephone me-1"></i>${escapeHtml(s.telefono)}</p>` : ''}
        </div>
      `).join('');
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare le sedi.</p>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  async function init() {
    renderNav();
    if (ruolo === 'paziente') {
      document.getElementById('contattiFooter').style.display = '';
      caricaContattiFooter();
      await renderPaziente();
    } else if (ruolo === 'tecnico') {
      await renderTecnico();
    } else if (ruolo === 'segretario') {
      await renderSegretario();
    } else if (ruolo === 'medico') {
      await renderMedico();
    } else if (ruolo === 'amministratore') {
      await renderAdmin();
    } else {
      renderInCostruzione();
    }
  }

  function renderInCostruzione() {
    contentEl.innerHTML = `
      <p class="hl-greeting">Ciao!</p>
      <p class="hl-greeting-sub">La tua area riservata (${ruolo}) è in costruzione.</p>
    `;
  }

  async function renderPaziente() {
    try {
      const res = await axios.get(`${API_BASE_URL}/dashboard/paziente`);
      const d = res.data;

      let prossimaHtml = '';
      if (d.prossimaPrenotazione) {
        const data = new Date(d.prossimaPrenotazione.dataOra);
        const dataStr = data.toLocaleDateString('it-IT', { day: '2-digit', month: 'long' });
        const oraStr = data.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        prossimaHtml = `
          <div class="hl-highlight-card">
            <span class="hl-highlight-icon"><i class="bi bi-calendar-event"></i></span>
            <div>
              <h3>${d.prossimaPrenotazione.nomeServizio}</h3>
              <p>${dataStr} alle ${oraStr}</p>
            </div>
          </div>
        `;
      } else {
        prossimaHtml = `
          <div class="hl-highlight-card">
            <span class="hl-highlight-icon"><i class="bi bi-calendar-event"></i></span>
            <div>
              <h3>Nessuna prenotazione</h3>
              <p class="hl-highlight-empty">Non hai appuntamenti in programma</p>
            </div>
          </div>
        `;
      }

      const refertiHtml = `
        <div class="hl-highlight-card">
          <span class="hl-highlight-icon"><i class="bi bi-file-earmark-medical"></i></span>
          <div>
            <h3>${d.refertiRecenti > 0 ? `${d.refertiRecenti} nuovo/i referto/i` : 'Nessun referto recente'}</h3>
            <p>${d.refertiRecenti > 0 ? 'Caricati negli ultimi 7 giorni' : 'Nessuna novità negli ultimi 7 giorni'}</p>
          </div>
        </div>
      `;

      contentEl.innerHTML = `
        <p class="hl-greeting">Ciao, ${d.nome}!</p>
        <p class="hl-greeting-sub">Ecco un riepilogo della tua area personale.</p>

        <div class="hl-highlights">
          ${prossimaHtml}
          ${refertiHtml}
        </div>

        <p class="hl-quick-title">Cosa vuoi fare?</p>
        <div class="hl-quick-grid">
          <a href="prenota.html" class="hl-quick-card">
            <span class="hl-quick-icon"><i class="bi bi-calendar-plus"></i></span>
            <h3>Prenota un servizio</h3>
            <p>Sfoglia il catalogo per categoria</p>
          </a>
          <a href="le-mie-prenotazioni.html" class="hl-quick-card">
            <span class="hl-quick-icon"><i class="bi bi-list-check"></i></span>
            <h3>Le mie prenotazioni</h3>
            <p>Consulta e gestisci i tuoi appuntamenti</p>
          </a>
          <a href="referti.html" class="hl-quick-card">
            <span class="hl-quick-icon"><i class="bi bi-file-earmark-pdf"></i></span>
            <h3>I miei referti</h3>
            <p>Scarica i referti disponibili</p>
          </a>
          <a href="profilo.html" class="hl-quick-card">
            <span class="hl-quick-icon"><i class="bi bi-person"></i></span>
            <h3>Il mio profilo</h3>
            <p>Consulta i tuoi dati anagrafici</p>
          </a>
        </div>
      `;

    } catch (error) {
      contentEl.innerHTML = '<p class="hl-greeting-sub">Impossibile caricare la dashboard.</p>';
    }
  }

  // ===================== Sezione Tecnico (RF-11 / RF-12) =====================

  const MESI_IT = [
    'gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno',
    'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'
  ];
  const GIORNI_SETTIMANA_IT = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];

  const oggiISO = new Date().toISOString().slice(0, 10);
  let calMese = new Date().getMonth() + 1; // 1-12
  let calAnno = new Date().getFullYear();
  let giornoSelezionato = null; // 'YYYY-MM-DD' oppure null

  // Fasce da mezz'ora, stesse usate dal backend per gli slot prenotabili (08:00-17:30)
  const FASCE_ORARIE = (() => {
    const fasce = [];
    let minutiTotali = 8 * 60;
    while (minutiTotali < 18 * 60) {
      const h = String(Math.floor(minutiTotali / 60)).padStart(2, '0');
      const m = String(minutiTotali % 60).padStart(2, '0');
      fasce.push(`${h}:${m}`);
      minutiTotali += 30;
    }
    return fasce;
  })();

  // Stato del mini-calendario nel modale "Sposta prenotazione" — indipendente
  // dal calendario principale dell'agenda.
  let spostaIdPrenotazione = null;
  let spostaMese = new Date().getMonth() + 1;
  let spostaAnno = new Date().getFullYear();
  let spostaGiornoSelezionato = null;
  let spostaOraSelezionata = null;
  let spostaOrariOccupati = []; // fasce "HH:mm" non disponibili per il giorno scelto

  async function renderTecnico() {
    let nomeCompleto = '';
    try {
      const res = await axios.get(`${API_BASE_URL}/tecnico/me`);
      nomeCompleto = `${res.data.nome} ${res.data.cognome}`;
    } catch (error) {
      // Se la chiamata fallisce, il saluto resta generico
    }

    contentEl.innerHTML = `
      <p class="hl-greeting">${nomeCompleto ? `Dashboard tecnico ${escapeHtml(nomeCompleto)}` : 'Ciao!'}</p>
      <p class="hl-greeting-sub">Agenda delle prestazioni a te assegnate. Seleziona il giorno evidenziato per verificare i dettagli.</p>

      <div class="hl-calendar-card">
        <div class="hl-calendar-header">
          <button type="button" class="hl-calendar-nav-btn" id="calPrevBtn"><i class="bi bi-chevron-left"></i></button>
          <span class="hl-calendar-month-label" id="calLabel"></span>
          <button type="button" class="hl-calendar-nav-btn" id="calNextBtn"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="hl-calendar-grid" id="calGrid"></div>
        <div class="hl-calendar-detail" id="calDetail" style="display: none;">
          <p class="hl-calendar-detail-title" id="calDetailTitle"></p>
          <div id="agendaList" class="hl-agenda-list"></div>
        </div>
      </div>

      <p class="hl-section-title">Referti da caricare</p>
      <p class="hl-section-sub">Prestazioni eseguite in attesa del referto, dalla più vecchia alla più recente.</p>
      <div class="hl-refertare-wrap" id="refertareWrap"></div>

      <p class="hl-section-title" style="margin-top: 2rem;">Storico prenotazioni</p>
      <p class="hl-section-sub">Le tue ultime prenotazioni passate, con il relativo esito.</p>

      <div class="hl-storico-filtri">
        <input type="text" id="storicoRicerca" class="hl-storico-search" placeholder="Cerca per nome o codice fiscale">
        <select id="storicoStatoFiltro" class="hl-storico-select">
          <option value="">Tutti gli stati</option>
          <option value="REFERTATA">Referto caricato</option>
          <option value="NON_COMPLETATA">Non completata</option>
          <option value="ANNULLATA">Annullata</option>
          <option value="DA_GESTIRE">Da gestire</option>
        </select>
      </div>

      <div class="hl-refertare-wrap" id="storicoWrap"></div>
    `;

    document.getElementById('calPrevBtn').addEventListener('click', () => cambiaMese(-1));
    document.getElementById('calNextBtn').addEventListener('click', () => cambiaMese(1));

    await renderCalendario();
    await caricaDaRefertare();
    await caricaStorico();
  }

  async function cambiaMese(delta) {
    calMese += delta;
    if (calMese > 12) { calMese = 1; calAnno++; }
    if (calMese < 1) { calMese = 12; calAnno--; }
    giornoSelezionato = null;
    document.getElementById('calDetail').style.display = 'none';
    await renderCalendario();
  }

  async function renderCalendario() {
    const labelEl = document.getElementById('calLabel');
    labelEl.textContent = `${MESI_IT[calMese - 1]} ${calAnno}`;

    let conteggioPerGiorno = {};
    try {
      const res = await axios.get(`${API_BASE_URL}/tecnico/agenda/giorni-con-prenotazioni`, {
        params: { anno: calAnno, mese: calMese }
      });
      conteggioPerGiorno = res.data.conteggioPerGiorno || {};
    } catch (error) {
      // In caso di errore mostriamo comunque il calendario, senza evidenziazioni
    }

    const gridEl = document.getElementById('calGrid');
    const primoGiorno = new Date(calAnno, calMese - 1, 1);
    const offset = (primoGiorno.getDay() + 6) % 7; // Lun=0 ... Dom=6
    const giorniNelMese = new Date(calAnno, calMese, 0).getDate();

    let html = GIORNI_SETTIMANA_IT.map(g => `<div class="hl-calendar-weekday">${g}</div>`).join('');

    for (let i = 0; i < offset; i++) {
      html += `<div class="hl-calendar-day hl-day-empty"></div>`;
    }

    for (let giorno = 1; giorno <= giorniNelMese; giorno++) {
      const dataISO = `${calAnno}-${String(calMese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
      const conteggio = conteggioPerGiorno[giorno] || 0;
      const classi = ['hl-calendar-day'];
      if (conteggio > 0) classi.push('hl-day-has-prenotazioni');
      if (dataISO === oggiISO) classi.push('hl-day-today');
      if (dataISO === giornoSelezionato) classi.push('hl-day-selected');

      const badgeHtml = conteggio > 0 ? `<span class="hl-calendar-day-badge">+${conteggio}</span>` : '';

      html += `
        <button type="button" class="${classi.join(' ')}" data-data-iso="${dataISO}">
          <span>${giorno}</span>
          ${badgeHtml}
        </button>
      `;
    }

    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.hl-calendar-day:not(.hl-day-empty)').forEach(btn => {
      btn.addEventListener('click', () => selezionaGiorno(btn.getAttribute('data-data-iso')));
    });
  }

  async function selezionaGiorno(dataISO) {
    giornoSelezionato = dataISO;
    await renderCalendario();

    const detailEl = document.getElementById('calDetail');
    const detailTitleEl = document.getElementById('calDetailTitle');
    detailEl.style.display = 'block';

    const dataLeggibile = new Date(dataISO + 'T00:00:00').toLocaleDateString('it-IT', {
      weekday: 'long', day: 'numeric', month: 'long'
    });
    detailTitleEl.textContent = `Prestazioni del ${dataLeggibile}`;

    await caricaAgenda(dataISO);
  }

  async function caricaAgenda(data) {
    const listEl = document.getElementById('agendaList');
    listEl.innerHTML = '<p class="hl-greeting-sub">Caricamento…</p>';

    try {
      const res = await axios.get(`${API_BASE_URL}/tecnico/agenda`, { params: { data } });
      const items = res.data;

      if (!items.length) {
        listEl.innerHTML = '<p class="hl-highlight-empty">Nessuna prestazione assegnata per questo giorno.</p>';
        return;
      }

      listEl.innerHTML = items.map(renderAgendaCard).join('');
      attachAgendaHandlers();

    } catch (error) {
      listEl.innerHTML = '<p class="hl-greeting-sub">Impossibile caricare l\'agenda.</p>';
    }
  }

  function renderAgendaCard(item) {
    const dataOra = new Date(item.dataOra);
    const oraStr = dataOra.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    const futura = dataOra.getTime() > Date.now();

    let statoHtml;
    if (item.refertoCaricato) {
      statoHtml = `<span class="hl-badge-done"><i class="bi bi-check-circle-fill me-1"></i>Referto caricato</span>`;
    } else if (item.motivoMancatoReferto) {
      statoHtml = `<span class="hl-badge-non-completata" title="${escapeHtml(item.motivoMancatoReferto)}">
        <i class="bi bi-x-circle-fill me-1"></i>Non completata
      </span>`;

  function attachAgendaHandlers() {
    document.querySelectorAll('.hl-btn-avvia-sposta').forEach(btn => {
      btn.addEventListener('click', () => apriFormSposta(btn.getAttribute('data-id')));
    });
  }

  function apriFormSposta(idPrenotazione) {
    spostaIdPrenotazione = idPrenotazione;
    spostaMese = new Date().getMonth() + 1;
    spostaAnno = new Date().getFullYear();
    spostaGiornoSelezionato = null;
    spostaOraSelezionata = null;
    spostaOrariOccupati = [];

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'spostaOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel">
        <p class="hl-modal-title">Sposta prenotazione</p>
        <p class="hl-modal-sub">Scegli un nuovo giorno e una nuova fascia oraria.</p>

        <div class="hl-calendar-header">
          <button type="button" class="hl-calendar-nav-btn" id="spostaPrevBtn"><i class="bi bi-chevron-left"></i></button>
          <span class="hl-calendar-month-label" id="spostaMeseLabel"></span>
          <button type="button" class="hl-calendar-nav-btn" id="spostaNextBtn"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="hl-calendar-grid" id="spostaGrid"></div>

        <div class="hl-slot-grid" id="spostaSlotGrid"></div>

        <p class="hl-sposta-error" id="spostaErrore"></p>

        <div class="hl-modal-actions">
          <button type="button" class="hl-btn-annulla-upload" id="spostaAnnullaBtn">Annulla</button>
          <button type="button" class="hl-btn-upload" id="spostaConfermaBtn" disabled>Conferma</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    // Click sullo sfondo scuro chiude il modale, click sul pannello no
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleSposta();
    });
    document.getElementById('spostaAnnullaBtn').addEventListener('click', chiudiModaleSposta);
    document.getElementById('spostaPrevBtn').addEventListener('click', () => cambiaMeseSposta(-1));
    document.getElementById('spostaNextBtn').addEventListener('click', () => cambiaMeseSposta(1));
    document.getElementById('spostaConfermaBtn').addEventListener('click', confermaSposta);

    renderCalendarioSposta();
    renderSlotGridSposta();
  }

  function chiudiModaleSposta() {
    const overlay = document.getElementById('spostaOverlay');
    if (overlay) overlay.remove();
  }

  function cambiaMeseSposta(delta) {
    spostaMese += delta;
    if (spostaMese > 12) { spostaMese = 1; spostaAnno++; }
    if (spostaMese < 1) { spostaMese = 12; spostaAnno--; }
    spostaGiornoSelezionato = null;
    spostaOraSelezionata = null;
    spostaOrariOccupati = [];
    renderCalendarioSposta();
    renderSlotGridSposta();
  }

  function renderCalendarioSposta() {
    document.getElementById('spostaMeseLabel').textContent = `${MESI_IT[spostaMese - 1]} ${spostaAnno}`;

    const gridEl = document.getElementById('spostaGrid');
    const primoGiorno = new Date(spostaAnno, spostaMese - 1, 1);
    const offset = (primoGiorno.getDay() + 6) % 7;
    const giorniNelMese = new Date(spostaAnno, spostaMese, 0).getDate();


    const oggiInizio = new Date();
    oggiInizio.setHours(0, 0, 0, 0);

    let html = GIORNI_SETTIMANA_IT.map(g => `<div class="hl-calendar-weekday">${g}</div>`).join('');
    for (let i = 0; i < offset; i++) {
      html += `<div class="hl-calendar-day hl-day-empty"></div>`;
    }
    for (let giorno = 1; giorno <= giorniNelMese; giorno++) {
      const dataISO = `${spostaAnno}-${String(spostaMese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
      const nonSelezionabile = new Date(spostaAnno, spostaMese - 1, giorno).getTime() <= oggiInizio.getTime();
      const classi = ['hl-calendar-day'];
      if (nonSelezionabile) classi.push('hl-day-disabled');
      if (dataISO === spostaGiornoSelezionato) classi.push('hl-day-selected');

      html += nonSelezionabile
        ? `<div class="${classi.join(' ')}">${giorno}</div>`
        : `<button type="button" class="${classi.join(' ')}" data-data-iso="${dataISO}">${giorno}</button>`;
    }
    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.hl-calendar-day:not(.hl-day-empty):not(.hl-day-disabled)').forEach(btn => {
      btn.addEventListener('click', () => selezionaGiornoSposta(btn.getAttribute('data-data-iso')));
    });
  }

  async function selezionaGiornoSposta(dataISO) {
    spostaGiornoSelezionato = dataISO;
    spostaOraSelezionata = null;
    renderCalendarioSposta();

    const slotGridEl = document.getElementById('spostaSlotGrid');
    slotGridEl.innerHTML = '<p class="hl-highlight-empty" style="grid-column: 1 / -1; margin: 0.5rem 0;">Caricamento fasce…</p>';
    aggiornaStatoConfermaSposta();

    try {
      const res = await axios.get(
        `${API_BASE_URL}/tecnico/prenotazioni/${spostaIdPrenotazione}/orari-occupati`,
        { params: { data: dataISO } }
      );
      spostaOrariOccupati = res.data;
    } catch (error) {
      spostaOrariOccupati = [];
    }

    renderSlotGridSposta();
  }

  function renderSlotGridSposta() {
    const slotGridEl = document.getElementById('spostaSlotGrid');

    if (!spostaGiornoSelezionato) {
      slotGridEl.innerHTML = '';
      aggiornaStatoConfermaSposta();
      return;
    }

    slotGridEl.innerHTML = FASCE_ORARIE.map(fascia => {
      const occupata = spostaOrariOccupati.includes(fascia);
      const selezionata = fascia === spostaOraSelezionata ? 'hl-slot-selected' : '';
      return `<button type="button" class="hl-slot-btn ${selezionata}" data-fascia="${fascia}" ${occupata ? 'disabled' : ''}>${fascia}</button>`;
    }).join('');

    slotGridEl.querySelectorAll('.hl-slot-btn:not(:disabled)').forEach(btn => {
      btn.addEventListener('click', () => {
        spostaOraSelezionata = btn.getAttribute('data-fascia');
        renderSlotGridSposta();
      });
    });

    aggiornaStatoConfermaSposta();
  }

  function aggiornaStatoConfermaSposta() {
    document.getElementById('spostaConfermaBtn').disabled =
      !(spostaGiornoSelezionato && spostaOraSelezionata);
  }

  async function confermaSposta() {
    const errorEl = document.getElementById('spostaErrore');
    const btn = document.getElementById('spostaConfermaBtn');

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Spostamento…';

    const nuovaDataOra = `${spostaGiornoSelezionato}T${spostaOraSelezionata}:00`;

    try {
      await axios.patch(`${API_BASE_URL}/tecnico/prenotazioni/${spostaIdPrenotazione}/sposta`, {
        nuovaDataOra
      });

      chiudiModaleSposta();

      // La prenotazione potrebbe essere stata spostata dal giorno corrente
      // ricarichiamo sia il dettaglio giorno sia il calendario,
      // così il badge "+N" e l'evidenziazione restano coerenti.
      if (giornoSelezionato) await caricaAgenda(giornoSelezionato);
      await renderCalendario();

    } catch (error) {
      btn.disabled = false;
      btn.textContent = 'Conferma';
      errorEl.textContent = error.response?.data?.message || 'Spostamento non riuscito. Riprova.';
    }
  }

        });

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Conferma';

  function apriFormUpload(idPrenotazione) {
    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'uploadOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel">
        <p class="hl-modal-title">Carica referto</p>
        <p class="hl-modal-sub">Seleziona il file e conferma la chiusura della prestazione.</p>

        <form id="uploadForm">
          <input type="file" name="file" required class="hl-upload-input" style="width: 100%; margin-bottom: 0.9rem;">
          <label class="hl-confirm-label" style="max-width: none;">
            <input type="checkbox" required class="hl-confirm-checkbox">
            Confermo che il ciclo di questa visita è terminato
          </label>
          <p class="hl-upload-error" id="uploadErrore"></p>
          <div class="hl-modal-actions">
            <button type="button" class="hl-btn-annulla-upload" id="uploadAnnullaBtn">Annulla</button>
            <button type="submit" class="hl-btn-upload" id="uploadConfermaBtn">Conferma</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleGenerico('uploadOverlay');
    });
    document.getElementById('uploadAnnullaBtn')
      .addEventListener('click', () => chiudiModaleGenerico('uploadOverlay'));

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fileInput = e.target.querySelector('input[type="file"]');
      const checkbox = e.target.querySelector('.hl-confirm-checkbox');
      const errorEl = document.getElementById('uploadErrore');
      const submitBtn = document.getElementById('uploadConfermaBtn');

      if (!fileInput.files.length || !checkbox.checked) {
        errorEl.textContent = 'Seleziona un file e conferma la spunta per procedere.';
        return;
      }

      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Caricamento…';

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        await axios.post(`${API_BASE_URL}/referti/prenotazione/${idPrenotazione}`, formData);

        chiudiModaleGenerico('uploadOverlay');
        rimuoviRigaDaRefertare(idPrenotazione);

        // Se il giorno corrispondente è quello selezionato nel calendario,
        // aggiorniamo anche il dettaglio sotto
        if (giornoSelezionato) await caricaAgenda(giornoSelezionato);

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Conferma';
        errorEl.textContent = error.response?.data?.message || 'Caricamento non riuscito. Riprova.';
      }
    });
  }

  let storicoItemsCache = [];

  async function caricaStorico() {
    const wrapEl = document.getElementById('storicoWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';

    try {
      const res = await axios.get(`${API_BASE_URL}/tecnico/storico`);
      storicoItemsCache = res.data;
      renderTabellaStorico(storicoItemsCache);

      // Filtri client-side: niente nuove chiamate al backend, il dataset è
      // già tutto in memoria (max 50 righe, vedi TecnicoService.getStorico).
      document.getElementById('storicoRicerca').addEventListener('input', applicaFiltriStorico);
      document.getElementById('storicoStatoFiltro').addEventListener('change', applicaFiltriStorico);

    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare lo storico.</p>';
    }
  }

  function applicaFiltriStorico() {
    const testo = document.getElementById('storicoRicerca').value.trim().toLowerCase();
    const stato = document.getElementById('storicoStatoFiltro').value;

    const filtrati = storicoItemsCache.filter(item => {
      const matchTesto = !testo
        || item.nomePaziente.toLowerCase().includes(testo)
        || (item.codiceFiscalePaziente || '').toLowerCase().includes(testo);
      const matchStato = !stato || item.stato === stato;
      return matchTesto && matchStato;
    });

    renderTabellaStorico(filtrati);
  }

  function renderTabellaStorico(items) {
    const wrapEl = document.getElementById('storicoWrap');

    if (!items.length) {
      wrapEl.innerHTML = storicoItemsCache.length
        ? '<p class="hl-refertare-empty">Nessun risultato per questi filtri.</p>'
        : '<p class="hl-refertare-empty">Nessuna prenotazione passata.</p>';
      return;
    }

    wrapEl.innerHTML = `
      <table class="hl-refertare-table">
        <thead>

    const mappa = { agenda: 'tabPanelAgenda', storico: 'tabPanelStorico', anagrafica: 'tabPanelAnagrafica', ferie: 'tabPanelFerie' };
    document.getElementById(mappa[tab]).classList.add('active');

    // Aggiorno i dati ad ogni cambio tab, rispettando l'eventuale

    if (tab === 'agenda') {
      caricaPrenotazioniSegretario(document.getElementById('prenotazioniRicerca').value);

      caricaStoricoSegretario(document.getElementById('storicoSegretarioRicerca').value);

      caricaPazienti(document.getElementById('pazientiRicerca').value);
    } else if (tab === 'ferie') {
      caricaFerie();

    // idem come sopra.

      caricaPrenotazioniSegretario(document.getElementById('prenotazioniRicerca').value);
    } else if (tab === 'storico') {
      caricaStoricoSegretario(document.getElementById('storicoSegretarioRicerca').value);

  // ---------- Modale "Sposta" (Segretario — qualunque prenotazione della sede) ----------

  function apriModaleSpostaSegretario(idPrenotazione) {
    spostaIdPrenotazione = idPrenotazione;
    spostaMese = new Date().getMonth() + 1;
    spostaAnno = new Date().getFullYear();
    spostaGiornoSelezionato = null;
    spostaOraSelezionata = null;
    spostaOrariOccupati = [];

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'spostaOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel">
        <p class="hl-modal-title">Sposta prenotazione</p>
        <p class="hl-modal-sub">Scegli un nuovo giorno e una nuova fascia oraria.</p>

        <div class="hl-calendar-header">
          <button type="button" class="hl-calendar-nav-btn" id="spostaPrevBtn"><i class="bi bi-chevron-left"></i></button>
          <span class="hl-calendar-month-label" id="spostaMeseLabel"></span>
          <button type="button" class="hl-calendar-nav-btn" id="spostaNextBtn"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="hl-calendar-grid" id="spostaGrid"></div>

        <div class="hl-slot-grid" id="spostaSlotGrid"></div>

        <p class="hl-sposta-error" id="spostaErrore"></p>

        <div class="hl-modal-actions">
          <button type="button" class="hl-btn-annulla-upload" id="spostaAnnullaBtn">Annulla</button>
          <button type="button" class="hl-btn-upload" id="spostaConfermaBtn" disabled>Conferma</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleGenerico('spostaOverlay');
    });
    document.getElementById('spostaAnnullaBtn').addEventListener('click', () => chiudiModaleGenerico('spostaOverlay'));
    document.getElementById('spostaPrevBtn').addEventListener('click', () => cambiaMeseSpostaSegretario(-1));
    document.getElementById('spostaNextBtn').addEventListener('click', () => cambiaMeseSpostaSegretario(1));
    document.getElementById('spostaConfermaBtn').addEventListener('click', confermaSpostaSegretario);

    renderCalendarioSpostaSegretario();
  }

  function cambiaMeseSpostaSegretario(delta) {
    spostaMese += delta;
    if (spostaMese > 12) { spostaMese = 1; spostaAnno++; }
    if (spostaMese < 1) { spostaMese = 12; spostaAnno--; }
    spostaGiornoSelezionato = null;
    spostaOraSelezionata = null;
    spostaOrariOccupati = [];
    renderCalendarioSpostaSegretario();
    renderSlotGridSposta();
  }

  // Versione senza controllo occupati "sul posto" (non abbiamo un endpoint
  // orari-occupati generico per il Segretario come per il Tecnico): il
  // riscontro reale avviene comunque lato backend al momento della conferma,
  // che verifica capacità e vincolo anti-race-condition.
  function renderCalendarioSpostaSegretario() {
    document.getElementById('spostaMeseLabel').textContent = `${MESI_IT[spostaMese - 1]} ${spostaAnno}`;

    const gridEl = document.getElementById('spostaGrid');
    const primoGiorno = new Date(spostaAnno, spostaMese - 1, 1);
    const offset = (primoGiorno.getDay() + 6) % 7;
    const giorniNelMese = new Date(spostaAnno, spostaMese, 0).getDate();

    const oggiInizio = new Date();
    oggiInizio.setHours(0, 0, 0, 0);

    let html = GIORNI_SETTIMANA_IT.map(g => `<div class="hl-calendar-weekday">${g}</div>`).join('');
    for (let i = 0; i < offset; i++) {
      html += `<div class="hl-calendar-day hl-day-empty"></div>`;
    }
    for (let giorno = 1; giorno <= giorniNelMese; giorno++) {
      const dataISO = `${spostaAnno}-${String(spostaMese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
      const nonSelezionabile = new Date(spostaAnno, spostaMese - 1, giorno).getTime() <= oggiInizio.getTime();
      const classi = ['hl-calendar-day'];
      if (nonSelezionabile) classi.push('hl-day-disabled');
      if (dataISO === spostaGiornoSelezionato) classi.push('hl-day-selected');

      html += nonSelezionabile
        ? `<div class="${classi.join(' ')}">${giorno}</div>`
        : `<button type="button" class="${classi.join(' ')}" data-data-iso="${dataISO}">${giorno}</button>`;
    }
    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.hl-calendar-day:not(.hl-day-empty):not(.hl-day-disabled)').forEach(btn => {
      btn.addEventListener('click', () => {
        spostaGiornoSelezionato = btn.getAttribute('data-data-iso');
        spostaOraSelezionata = null;
        renderCalendarioSpostaSegretario();
        renderSlotGridSposta();
      });
    });
  }

  async function confermaSpostaSegretario() {
    const errorEl = document.getElementById('spostaErrore');
    const btn = document.getElementById('spostaConfermaBtn');

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Spostamento…';

    const nuovaDataOra = `${spostaGiornoSelezionato}T${spostaOraSelezionata}:00`;

    try {
      await axios.patch(`${API_BASE_URL}/segretario/prenotazioni/${spostaIdPrenotazione}/sposta`, {
        nuovaDataOra
      });

      chiudiModaleGenerico('spostaOverlay');
      await caricaPrenotazioniSegretario(document.getElementById('prenotazioniRicerca').value);

    } catch (error) {
      btn.disabled = false;
      btn.textContent = 'Conferma';
      errorEl.textContent = error.response?.data?.message || 'Spostamento non riuscito. Riprova.';
    }
  }

  async function apriModaleRiassegna(idPrenotazione, tipoEsecutore) {
    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'riassegnaOverlay';

    overlay.innerHTML = `

        <p class="hl-modal-sub">Scegli tra chi è libero in quello stesso slot.</p>

        <div id="riassegnaOpzioniWrap">

        </div>

        <p class="hl-sposta-error" id="riassegnaErrore"></p>

        <div class="hl-modal-actions">
          <button type="button" class="hl-btn-annulla-upload" id="riassegnaAnnullaBtn">Chiudi</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleGenerico('riassegnaOverlay');
    });
    document.getElementById('riassegnaAnnullaBtn')
      .addEventListener('click', () => chiudiModaleGenerico('riassegnaOverlay'));

    const opzioniWrap = document.getElementById('riassegnaOpzioniWrap');

    try {
      const res = await axios.get(`${API_BASE_URL}/segretario/prenotazioni/${idPrenotazione}/esecutori-disponibili`);
      const opzioni = res.data;

      if (!opzioni.length) {
        opzioniWrap.innerHTML = `<p class="hl-refertare-empty">Nessun ${etichetta} libero in questo slot.</p>`;
        return;
      }

      opzioniWrap.innerHTML = opzioni.map(o => `
        <button type="button" class="hl-slot-btn hl-btn-scegli-esecutore" data-id-esecutore="${o.id}"
          style="width: 100%; text-align: left; margin-bottom: 0.5rem; padding: 0.6rem 0.8rem;">
          ${escapeHtml(o.nomeCompleto)}
        </button>
      `).join('');

      opzioniWrap.querySelectorAll('.hl-btn-scegli-esecutore').forEach(btn => {
        btn.addEventListener('click', () => confermaRiassegna(idPrenotazione, btn.getAttribute('data-id-esecutore')));

    } catch (error) {
      opzioniWrap.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare le opzioni disponibili.</p>';

  async function confermaRiassegna(idPrenotazione, idNuovoEsecutore) {

    try {

        idNuovoEsecutore: parseInt(idNuovoEsecutore, 10)
      });

      await caricaPrenotazioniSegretario(document.getElementById('prenotazioniRicerca').value);

    } catch (error) {

  function formattaDataIt(dataISO) {
    const d = new Date(dataISO + 'T00:00:00');
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function renderRisorsaFerie(risorsa) {
    const tagClass = risorsa.tipo === 'MEDICO' ? 'hl-tag-visita' : 'hl-tag-diretto';
    const tagLabel = risorsa.tipo === 'MEDICO' ? 'Medico' : 'Tecnico';

    const periodiHtml = risorsa.ferie.length
      ? risorsa.ferie.map(f => `
          <div class="hl-risorsa-ferie-periodo">
            <span>${formattaDataIt(f.dataInizio)} → ${formattaDataIt(f.dataFine)}</span>
            <button type="button" class="hl-btn-rimuovi-ferie" data-id-ferie="${f.id}" data-tipo="${risorsa.tipo}" title="Rimuovi">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        `).join('')
      : '<p class="hl-highlight-empty">Nessun periodo di ferie programmato</p>';

    return `
      <div class="hl-risorsa-ferie-card">
        <div class="hl-risorsa-ferie-header">
          <div>
            <h3>${escapeHtml(risorsa.nomeCompleto)}</h3>
            <span class="hl-service-tag ${tagClass}">${tagLabel}</span>
          </div>
          <button type="button" class="hl-btn-sposta hl-btn-aggiungi-ferie"
            data-id="${risorsa.id}" data-tipo="${risorsa.tipo}" data-nome="${escapeHtml(risorsa.nomeCompleto)}">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi ferie
          </button>
        </div>
        <div class="hl-risorsa-ferie-list">
          ${periodiHtml}
        </div>
      </div>
    `;
  }

  async function rimuoviFerie(idFerie, tipo) {
    if (!confirm('Confermare la rimozione di questo periodo di ferie?')) return;

    const endpoint = tipo === 'MEDICO'
      ? `${API_BASE_URL}/segretario/ferie/medico/${idFerie}`
      : `${API_BASE_URL}/segretario/ferie/tecnico/${idFerie}`;

    try {
      await axios.delete(endpoint);
      await caricaFerie();
    } catch (error) {
      alert(error.response?.data?.message || 'Impossibile rimuovere il periodo di ferie.');
    }
  }

  // ---------- Modale "Aggiungi ferie" — calendario a intervallo ----------

  function apriModaleFerie(idRisorsa, tipoRisorsa, nomeRisorsa) {
    ferieRisorsaId = idRisorsa;
    ferieRisorsaTipo = tipoRisorsa;
    ferieMese = new Date().getMonth() + 1;
    ferieAnno = new Date().getFullYear();
    ferieDataInizio = null;
    ferieDataFine = null;

    const overlay = document.createElement('div');
    overlay.className = 'hl-modal-overlay';
    overlay.id = 'ferieOverlay';
    overlay.innerHTML = `
      <div class="hl-modal-panel">
        <p class="hl-modal-title">Ferie — ${escapeHtml(nomeRisorsa)}</p>
        <p class="hl-modal-sub">Clicca il primo giorno di assenza, poi l'ultimo.</p>

        <div class="hl-calendar-header">
          <button type="button" class="hl-calendar-nav-btn" id="feriePrevBtn"><i class="bi bi-chevron-left"></i></button>
          <span class="hl-calendar-month-label" id="ferieMeseLabel"></span>
          <button type="button" class="hl-calendar-nav-btn" id="ferieNextBtn"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="hl-calendar-grid" id="ferieGrid"></div>

        <p class="hl-section-sub" id="ferieRiepilogo" style="margin-top: 0.8rem;">Nessun periodo selezionato.</p>

        <p class="hl-sposta-error" id="ferieErrore"></p>

        <div class="hl-modal-actions">
          <button type="button" class="hl-btn-annulla-upload" id="ferieAnnullaBtn">Annulla</button>
          <button type="button" class="hl-btn-upload" id="ferieConfermaBtn" disabled>Conferma</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) chiudiModaleGenerico('ferieOverlay');
    });
    document.getElementById('ferieAnnullaBtn').addEventListener('click', () => chiudiModaleGenerico('ferieOverlay'));
    document.getElementById('feriePrevBtn').addEventListener('click', () => cambiaMeseFerie(-1));
    document.getElementById('ferieNextBtn').addEventListener('click', () => cambiaMeseFerie(1));
    document.getElementById('ferieConfermaBtn').addEventListener('click', confermaFerie);

    renderCalendarioFerie();
  }

  function cambiaMeseFerie(delta) {
    ferieMese += delta;
    if (ferieMese > 12) { ferieMese = 1; ferieAnno++; }
    if (ferieMese < 1) { ferieMese = 12; ferieAnno--; }
    renderCalendarioFerie();
  }

  function renderCalendarioFerie() {
    document.getElementById('ferieMeseLabel').textContent = `${MESI_IT[ferieMese - 1]} ${ferieAnno}`;

    const gridEl = document.getElementById('ferieGrid');
    const primoGiorno = new Date(ferieAnno, ferieMese - 1, 1);
    const offset = (primoGiorno.getDay() + 6) % 7;
    const giorniNelMese = new Date(ferieAnno, ferieMese, 0).getDate();

    const oggiInizio = new Date();
    oggiInizio.setHours(0, 0, 0, 0);

    let html = GIORNI_SETTIMANA_IT.map(g => `<div class="hl-calendar-weekday">${g}</div>`).join('');
    for (let i = 0; i < offset; i++) {
      html += `<div class="hl-calendar-day hl-day-empty"></div>`;
    }

    for (let giorno = 1; giorno <= giorniNelMese; giorno++) {
      const dataISO = `${ferieAnno}-${String(ferieMese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
      const nonSelezionabile = new Date(ferieAnno, ferieMese - 1, giorno).getTime() < oggiInizio.getTime();

      const classi = ['hl-calendar-day'];
      if (nonSelezionabile) classi.push('hl-day-disabled');

      const isEndpoint = dataISO === ferieDataInizio || dataISO === ferieDataFine;
      const isInRange = ferieDataInizio && ferieDataFine && dataISO > ferieDataInizio && dataISO < ferieDataFine;
      if (isEndpoint) classi.push('hl-day-range-endpoint');
      else if (isInRange) classi.push('hl-day-in-range');

      html += nonSelezionabile
        ? `<div class="${classi.join(' ')}">${giorno}</div>`
        : `<button type="button" class="${classi.join(' ')}" data-data-iso="${dataISO}">${giorno}</button>`;
    }
    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.hl-calendar-day:not(.hl-day-empty):not(.hl-day-disabled)').forEach(btn => {
      btn.addEventListener('click', () => selezionaGiornoFerie(btn.getAttribute('data-data-iso')));
    });

    aggiornaRiepilogoFerie();
  }

  function selezionaGiornoFerie(dataISO) {
    if (!ferieDataInizio || (ferieDataInizio && ferieDataFine)) {
      // Nessuna selezione in corso, o selezione già completa: si riparte da capo
      ferieDataInizio = dataISO;
      ferieDataFine = null;
    } else if (dataISO < ferieDataInizio) {
      // Cliccato un giorno prima dell'inizio già scelto: diventa lui il nuovo inizio
      ferieDataFine = ferieDataInizio;
      ferieDataInizio = dataISO;
    } else {
      ferieDataFine = dataISO;
    }
    renderCalendarioFerie();
  }

  function aggiornaRiepilogoFerie() {
    const riepilogoEl = document.getElementById('ferieRiepilogo');
    const confermaBtn = document.getElementById('ferieConfermaBtn');

    if (ferieDataInizio && ferieDataFine) {
      riepilogoEl.textContent = `Dal ${formattaDataIt(ferieDataInizio)} al ${formattaDataIt(ferieDataFine)}`;
      confermaBtn.disabled = false;
    } else if (ferieDataInizio) {
      riepilogoEl.textContent = `Dal ${formattaDataIt(ferieDataInizio)} — scegli l'ultimo giorno`;
      confermaBtn.disabled = true;
    } else {
      riepilogoEl.textContent = 'Nessun periodo selezionato.';
      confermaBtn.disabled = true;
    }
  }

  async function confermaFerie() {
    const errorEl = document.getElementById('ferieErrore');
    const btn = document.getElementById('ferieConfermaBtn');

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Salvataggio…';

    const endpoint = ferieRisorsaTipo === 'MEDICO'
      ? `${API_BASE_URL}/segretario/ferie/medico/${ferieRisorsaId}`
      : `${API_BASE_URL}/segretario/ferie/tecnico/${ferieRisorsaId}`;

    try {
      await axios.post(endpoint, {
        dataInizio: ferieDataInizio,
        dataFine: ferieDataFine
      });

      chiudiModaleGenerico('ferieOverlay');
      await caricaFerie();

    } catch (error) {
      btn.disabled = false;
      btn.textContent = 'Conferma';
      errorEl.textContent = error.response?.data?.message || 'Salvataggio non riuscito. Riprova.';
    }
  }

  // ---------- Popup "Prenota per conto" (RF-10bis) ----------

  let prenotaPerContoIdPaziente = null;
  let prenotaPerContoNomePaziente = null;

  function apriModalePrenotaPerConto(idPaziente, nomeCompleto) {
    prenotaPerContoIdPaziente = idPaziente;
    prenotaPerContoNomePaziente = nomeCompleto;

  async function caricaCategoriePerConto() {
    const selectEl = document.getElementById('ppcCategoria');

    try {
      const res = await axios.get(`${API_BASE_URL}/categorie`);
      const categorie = res.data;
      selectEl.innerHTML = '<option value="">Seleziona una categoria…</option>' +
        categorie.map(c => `<option value="${c.id}">${escapeHtml(c.nome)}</option>`).join('');
    } catch (error) {
      selectEl.innerHTML = '<option value="">Impossibile caricare le categorie</option>';
    }

    selectEl.addEventListener('change', () => {
      const wrapEl = document.getElementById('ppcServiziWrap');
      if (selectEl.value) {
        caricaServiziPerConto(selectEl.value);
      } else {
        wrapEl.innerHTML = '';
      }
    });
  }

  async function caricaServiziPerConto(idCategoria) {
    const wrapEl = document.getElementById('ppcServiziWrap');
    wrapEl.innerHTML = '<p class="hl-refertare-empty">Caricamento servizi…</p>';

    try {
      const res = await axios.get(`${API_BASE_URL}/prestazioni/categoria/${idCategoria}`);
      renderServiziPerConto(res.data);
    } catch (error) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare i servizi.</p>';
    }
  }

  function renderServiziPerConto(prestazioni) {
    const wrapEl = document.getElementById('ppcServiziWrap');

    if (!prestazioni.length) {
      wrapEl.innerHTML = '<p class="hl-refertare-empty">Nessun servizio disponibile in questa categoria.</p>';
      return;
    }

    wrapEl.innerHTML = '';
    prestazioni.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'hl-service-item';
      item.dataset.checked = 'false';

      const tagClass = p.tipo === 'diretta' ? 'hl-tag-diretto' : 'hl-tag-visita';
      const tagLabel = p.tipo === 'diretta' ? 'Accesso diretto' : 'Previa visita';

      item.innerHTML = `
        <div class="hl-service-header">
          <div class="hl-service-title-row">
            <h3>${escapeHtml(p.nome)}</h3>
            <span class="hl-service-tag ${tagClass}">${tagLabel}</span>
          </div>
          <i class="bi bi-chevron-down chevron"></i>
        </div>
        <div class="hl-service-detail"></div>
      `;

      item.querySelector('.hl-service-header')
        .addEventListener('click', () => toggleServizioPerConto(item, p));

      wrapEl.appendChild(item);
    });
  }

  async function toggleServizioPerConto(item, prestazione) {
    const wasOpen = item.classList.contains('open');
    item.classList.toggle('open');
    if (wasOpen) return;

    const detailEl = item.querySelector('.hl-service-detail');

    if (prestazione.tipo === 'diretta') {
      detailEl.innerHTML = '<p class="hl-refertare-empty">Caricamento…</p>';
      try {
        const serviziRes = await axios.get(`${API_BASE_URL}/prestazioni/${prestazione.id}/servizi`);
        detailEl.innerHTML = costruisciFormPrenotazionePerConto(prestazione.id, true, null, serviziRes.data);
        collegaFormPrenotazionePerConto(detailEl, prestazione.id, true);
      } catch (error) {
        detailEl.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare il servizio.</p>';
      }
      return;
    }

    // Previa visita: verifica autorizzazione SUL PAZIENTE per cui si sta
    // prenotando, non su chi è loggato (la Segretaria) — da qui l'idPaziente nella riga 2548
    if (item.dataset.checked === 'true') return;

    detailEl.innerHTML = '<p class="hl-refertare-empty">Verifica in corso…</p>';

    try {
      const res = await axios.get(`${API_BASE_URL}/prenotazioni/verifica-autorizzazione`, {
        params: { idPrestazionePreviaVisita: prestazione.id, idPaziente: prenotaPerContoIdPaziente }
      });

      item.dataset.checked = 'true';

      if (res.data.autorizzata) {
        detailEl.innerHTML = costruisciFormPrenotazionePerConto(prestazione.id, false);
        collegaFormPrenotazionePerConto(detailEl, prestazione.id, false);
      } else {
        detailEl.innerHTML = `
          <div class="hl-alert-error" style="margin-top:0;">
            <i class="bi bi-exclamation-triangle me-1"></i>
            Per prenotare una <strong>${escapeHtml(prestazione.nome)}</strong> è necessaria prima una
            <strong>${escapeHtml(res.data.nomeVisitaPropedeutica)}</strong>. Prenotala ora:
          </div>
          ${costruisciFormPrenotazionePerConto(res.data.idVisitaPropedeutica, true, res.data.nomeVisitaPropedeutica)}
        `;
        collegaFormPrenotazionePerConto(detailEl, res.data.idVisitaPropedeutica, true);
      }
    } catch (error) {
      detailEl.innerHTML = '<p class="hl-refertare-empty">Impossibile verificare la disponibilità. Riprova.</p>';
    }
  }

  function costruisciFormPrenotazionePerConto(idServizio, isDiretta, nomeVisita, parametri) {
    const label = nomeVisita ? `Prenota la ${escapeHtml(nomeVisita)}` : 'Conferma prenotazione';
    const today = new Date().toISOString().split('T')[0];

    const parametriHtml = (parametri && parametri.length) ? `
      <p class="hl-params-label">Seleziona i parametri desiderati:</p>
      <div class="hl-params-grid">
        ${parametri.map(p => `
          <label class="hl-param-check">
            <input type="checkbox" value="${p.id}"> ${escapeHtml(p.nome)}
          </label>
        `).join('')}
      </div>
    ` : '';

    return `
      ${parametriHtml}
      <div class="hl-form-row">
        <input type="date" class="hl-storico-search" data-field="data" min="${today}" value="${today}" style="max-width: 170px;">
      </div>
      <div class="hl-slots-grid" data-field="slots">
        <p class="hl-refertare-empty">Caricamento slot…</p>
      </div>
      <button type="button" class="hl-btn-upload btn-prenota-per-conto" disabled style="width: 100%;">
        <i class="bi bi-calendar-check me-1"></i> ${label}
      </button>
      <div class="hl-result"></div>
    `;
  }

  function collegaFormPrenotazionePerConto(detailEl, idServizio, isDiretta, idMedicoForzato, overlayIdDaSostituire) {
    const dataInput = detailEl.querySelector('[data-field="data"]');
    const slotsGrid = detailEl.querySelector('[data-field="slots"]');
    const btn = detailEl.querySelector('.btn-prenota-per-conto');

    let selectedSlot = null;

    async function loadSlots() {
      selectedSlot = null;
      btn.disabled = true;
      detailEl.querySelector('.hl-result').innerHTML = '';
      slotsGrid.innerHTML = '<p class="hl-refertare-empty">Caricamento slot…</p>';

      try {
        const res = await axios.get(`${API_BASE_URL}/prenotazioni/orari-occupati`, {
          params: { idServizio, isDiretta, data: dataInput.value }
        });
        const occupati = res.data;

        slotsGrid.innerHTML = FASCE_ORARIE.map(slot => {
          const isOccupato = occupati.includes(slot);
          return `<button type="button" class="hl-slot ${isOccupato ? 'occupied' : ''}"
                    data-slot="${slot}" ${isOccupato ? 'disabled' : ''}>${slot}</button>`;
        }).join('');

        slotsGrid.querySelectorAll('.hl-slot:not(.occupied)').forEach(el => {
          el.addEventListener('click', () => {
            slotsGrid.querySelectorAll('.hl-slot').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            selectedSlot = el.dataset.slot;
            btn.disabled = false;
          });
        });

      } catch (error) {
        slotsGrid.innerHTML = '<p class="hl-refertare-empty">Impossibile caricare gli slot.</p>';
      }
    }

    dataInput.addEventListener('change', loadSlots);
    loadSlots();

    btn.addEventListener('click', () => {
      if (!selectedSlot) return;
      prenotaPerConto(detailEl, idServizio, isDiretta, btn, dataInput.value, selectedSlot, idMedicoForzato, overlayIdDaSostituire);
    });
  }

  async function prenotaPerConto(detailEl, idServizio, isDiretta, btn, dataInput, oraInput, idMedicoForzato, overlayIdDaSostituire) {
    const resultEl = detailEl.querySelector('.hl-result');
    resultEl.innerHTML = '';

    const paramsGrid = detailEl.querySelector('.hl-params-grid');
    const checkboxSelezionati = Array.from(
      detailEl.querySelectorAll('.hl-param-check input:checked')
    ).map(cb => parseInt(cb.value, 10));

    if (paramsGrid && checkboxSelezionati.length === 0) {
      resultEl.innerHTML = '<div class="hl-alert-error"><i class="bi bi-exclamation-triangle me-1"></i>Seleziona almeno un parametro da analizzare.</div>';
      return;
    }

    const payload = {
      idPrestazioneDiretta: isDiretta ? idServizio : null,
      idPrestazionePreviaVisita: isDiretta ? null : idServizio,
      idPaziente: prenotaPerContoIdPaziente,
      // Valorizzato SOLO nel flusso "il medico autorizza e prenota subito per
      // sé" (RF-14, punto 15, Opzione B): forza l'assegnazione a lui stesso
      // invece di lasciar scegliere l'auto-assegnazione "primo libero", che
      // potrebbe altrimenti assegnare un collega della stessa specializzazione.
      idMedico: idMedicoForzato || null,
      dataOra: `${dataInput}T${oraInput}:00`,
      idServiziSelezionati: checkboxSelezionati
    };

    btn.disabled = true;
    btn.textContent = 'Invio in corso…';

    try {
      await axios.post(`${API_BASE_URL}/prenotazioni`, payload);

      const dataFormattata = new Date(dataInput + 'T00:00:00')
        .toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });

      if (overlayIdDaSostituire) {
        // Popup dedicato (es. "Prenota subito" del Medico): sostituiamo
        // l'INTERO pannello, non solo il dettaglio — l'utente vede solo il
        // messaggio di conferma con il paziente e la data, più "Chiudi".
        const overlay = document.getElementById(overlayIdDaSostituire);
        if (overlay) {
          const panel = overlay.querySelector('.hl-modal-panel');
          panel.innerHTML = `
            <p class="hl-modal-title">Prenotazione confermata</p>
            <p class="hl-modal-sub">
              Prenotazione per ${escapeHtml(prenotaPerContoNomePaziente || 'il paziente')}
              confermata per il ${dataFormattata} alle ${oraInput}.
            </p>
            <div class="hl-modal-actions" style="justify-content: center;">
              <button type="button" class="hl-btn-upload" id="prenotaContoChiudiFinaleBtn">Chiudi</button>
            </div>
          `;
          document.getElementById('prenotaContoChiudiFinaleBtn')
            .addEventListener('click', () => chiudiModaleGenerico(overlayIdDaSostituire));
        }
        return;
      }

      // Sostituiamo l'intero pannello (data, slot, pulsante) con la sola
      // conferma: dopo un esito positivo non ha senso lasciare i controlli
      // ancora visibili/cliccabili.
      detailEl.innerHTML = `
        <div class="hl-alert-success" style="margin-top: 0;">
          <i class="bi bi-check-circle me-1"></i>
          Prenotazione per ${escapeHtml(prenotaPerContoNomePaziente || 'il paziente')}
          confermata per il ${dataFormattata} alle ${oraInput}.
        </div>
      `;

    } catch (error) {
      const message = error.response?.data?.message || 'Errore durante la prenotazione. Riprova.';
      resultEl.innerHTML = `<div class="hl-alert-error"><i class="bi bi-exclamation-triangle me-1"></i>${message}</div>`;
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-calendar-check me-1"></i> Conferma prenotazione';
    }
  }

  function cambiaTabMedico(tab) {
    document.querySelectorAll('.hl-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);

    document.querySelectorAll('.hl-tab-panel').forEach(panel => panel.classList.remove('active'));
    const mappa = { visite: 'tabPanelVisite', pazienti: 'tabPanelPazientiMedico', prossimi: 'tabPanelProssimi' };

    if (tab === 'visite') {

      caricaProssimiAppuntamenti();
