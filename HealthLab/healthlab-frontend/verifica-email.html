<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthLab — Verifica email</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --hl-900: #0a3a57; --hl-700: #0f6690; --hl-red: #c23b3b; --hl-mute: #5c6b74; }
  body { font-family: "Source Sans 3", sans-serif; background: #f7fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
  .box { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e5edf1; border-radius: 16px; padding: 2.5rem; }
  .box h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--hl-900); margin-bottom: 0.6rem; }
  .box p { color: var(--hl-mute); margin-bottom: 1.5rem; }
  .box.error h1 { color: var(--hl-red); }
  .btn-go { background: var(--hl-700); color: #fff; border: none; padding: 0.6rem 1.4rem; border-radius: 999px; font-weight: 700; text-decoration: none; display: inline-block; }
</style>
</head>
<body>
  <div class="box" id="box">
    <h1>Verifica in corso…</h1>
    <p>Un attimo di pazienza.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script>
    const API_BASE_URL = 'http://localhost:8080/api';
    const token = new URLSearchParams(window.location.search).get('token');
    const box = document.getElementById('box');

    async function verifica() {
      if (!token) {
        box.classList.add('error');
        box.innerHTML = '<h1>Link non valido</h1><p>Nessun token di verifica trovato.</p>';
        return;
      }
      try {
        const res = await axios.get(`${API_BASE_URL}/auth/verifica`, { params: { token } });
        if (res.data.successo) {
          box.innerHTML = `<h1>Email confermata!</h1><p>${res.data.message}</p><a href="login.html" class="btn-go">Accedi ora</a>`;
        } else {
          box.classList.add('error');
          box.innerHTML = `<h1>Verifica non riuscita</h1><p>${res.data.message}</p>`;
        }
      } catch (error) {
        box.classList.add('error');
        box.innerHTML = '<h1>Errore</h1><p>Impossibile completare la verifica. Riprova più tardi.</p>';
      }
    }
    verifica();
  </script>
</body>
</html>
