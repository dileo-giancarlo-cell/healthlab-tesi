<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthLab — I miei referti</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<script>
  // ===== CONTROLLO RUOLO =====
  // Pagina riservata esclusivamente al Paziente. Tecnico/Medico/Segretario
  // vengono sempre rimandati alla home interna; 
  (function guardiaAccessoRuolo() {
    const token = localStorage.getItem('healthlab_token');
    if (!token) {
      window.location.href = 'login.html';
      return;
    }

    const ruolo = localStorage.getItem('healthlab_ruolo');
    const ruoliAmmessi = ['paziente']; // estendere qui quando arriva la sfumatura Admin

    if (!ruoliAmmessi.includes(ruolo)) {
      window.location.href = 'home-interna.html';
    }
  })();
</script>

<style>
  :root {
    --hl-white: #ffffff;
    --hl-900: #0a3a57;
    --hl-700: #0f6690;
    --hl-500: #1f8fc4;
    --hl-050: #eaf5fb;
    --hl-red: #c23b3b;
    --hl-ink: #16242c;
    --hl-mute: #5c6b74;
    --font-display: "Manrope", system-ui, sans-serif;
    --font-body: "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font-body); color: var(--hl-ink); background: #f7fafc; margin: 0; padding-top: 68px; }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.01em; }
  a { text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .hl-topbar {
    background: #fff; border-bottom: 1px solid #e5edf1; padding: 0.8rem 0;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  }
  .hl-brand { display: flex; align-items: center; gap: 0.6rem; color: var(--hl-900); }
  .hl-brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--hl-700);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hl-brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
  .hl-logout { color: var(--hl-mute); font-size: 0.88rem; font-weight: 600; }
  .hl-logout:hover { color: var(--hl-red); }

  .hl-mobile-menu-btn {
    display: none; background: none; border: none; color: var(--hl-900); font-size: 1.3rem;
    padding: 0.25rem 0.4rem; margin-left: 0.6rem;
  }
  @media (max-width: 767.98px) {
    .hl-mobile-menu-btn { display: inline-flex; align-items: center; }
  }
  .hl-mobile-menu { display: none; flex-direction: column; border-top: 1px solid #e5edf1; background: #fff; }
  .hl-mobile-menu.open { display: flex; }
  .hl-mobile-menu-link { padding: 0.85rem 1.2rem; color: var(--hl-ink); font-weight: 600; font-size: 0.92rem; border-bottom: 1px solid #f0f3f5; }
  .hl-mobile-menu-link:last-child { border-bottom: none; }
  .hl-mobile-menu-link.active { color: var(--hl-700); background: var(--hl-050); font-weight: 700; }

  .hl-topnav { gap: 0.2rem; }
  .hl-topnav-link { color: var(--hl-ink); font-weight: 600; font-size: 0.88rem; padding: 0.4rem 0.9rem; border-radius: 999px; }
  .hl-topnav-link:hover { color: var(--hl-700); }
  .hl-topnav-link.active { color: var(--hl-700); background: var(--hl-050); font-weight: 700; }

  .hl-page-header { max-width: 780px; margin: 0 auto; padding: 3rem 1rem 0.5rem; }
  .hl-page-header h1 { font-weight: 800; font-size: 2rem; letter-spacing: -0.02em; color: var(--hl-900); margin-bottom: 0.35rem; }
  .hl-page-header p { color: var(--hl-mute); margin: 0; }

  .hl-list { max-width: 780px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  @keyframes hl-fade-in-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hl-referto-item {
    background: #fff; border: 1px solid #edf1f4; border-radius: 12px;
    padding: 1.1rem 1.3rem; margin-bottom: 0.8rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    box-shadow: 0 1px 2px rgba(10,58,87,0.04), 0 10px 26px -20px rgba(10,58,87,0.22);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: hl-fade-in-up 0.4s ease both;
  }
  .hl-referto-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(10,58,87,0.06), 0 16px 34px -18px rgba(10,58,87,0.26);
  }
  .hl-referto-item .icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(155deg, var(--hl-050) 0%, #dcedf7 100%); color: var(--hl-700);
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
  }
  .hl-referto-info { display: flex; align-items: center; gap: 1rem; }
  .hl-referto-item h3 { font-size: 1rem; font-weight: 700; margin: 0 0 0.2rem; }
  .hl-referto-item .meta { font-size: 0.85rem; color: var(--hl-mute); margin: 0; }

  .hl-btn-download {
    background: var(--hl-700); color: #fff; font-weight: 700; font-size: 0.85rem;
    padding: 0.5rem 1.1rem; border-radius: 999px; border: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .hl-btn-download:hover { background: var(--hl-900); color: #fff; }
  .hl-btn-download:active { transform: scale(0.97); }

  .hl-loading, .hl-empty { text-align: center; color: var(--hl-mute); padding: 3.5rem 0; }
  .hl-loading i, .hl-empty i { display: block; font-size: 1.6rem; margin-bottom: 0.6rem; color: #c7d3da; }
</style>
</head>
<body>

<div class="hl-topbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="home-interna.html" class="hl-brand">
      <span class="hl-brand-mark">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13h4l2-7 3 14 3-10 2 3h6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="hl-brand-name">HealthLab</span>
    </a>
    <nav class="hl-topnav d-none d-md-flex align-items-center">
      <a href="home-interna.html" class="hl-topnav-link">Home</a>
      <a href="prenota.html" class="hl-topnav-link">Prenota</a>
      <a href="le-mie-prenotazioni.html" class="hl-topnav-link">Le mie prenotazioni</a>
      <a href="referti.html" class="hl-topnav-link">Referti</a>
      <a href="profilo.html" class="hl-topnav-link">Mio profilo</a>
    </nav>
    <div class="d-flex align-items-center">
      <a href="#" id="logoutLink" class="hl-logout"><i class="bi bi-box-arrow-right me-1"></i>Esci</a>
      <button type="button" class="hl-mobile-menu-btn" id="mobileMenuBtn" aria-label="Apri menu">
        <i class="bi bi-list"></i>
      </button>
    </div>
  </div>
  <div class="hl-mobile-menu" id="mobileMenu">
    <a href="home-interna.html" class="hl-mobile-menu-link">Home</a>
    <a href="prenota.html" class="hl-mobile-menu-link">Prenota</a>
    <a href="le-mie-prenotazioni.html" class="hl-mobile-menu-link">Le mie prenotazioni</a>
    <a href="referti.html" class="hl-mobile-menu-link">Referti</a>
    <a href="profilo.html" class="hl-mobile-menu-link">Mio profilo</a>
  </div>
</div>

<div class="hl-page-header">
  <h1>I miei referti</h1>
  <p>Consulta e scarica i referti resi disponibili dal laboratorio.</p>
</div>

<div class="hl-list" id="refertiList">
  <p class="hl-loading">Caricamento referti…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script>
  const API_BASE_URL = 'http://localhost:8080/api';

  const token = localStorage.getItem('healthlab_token');
  if (!token) {
    const destinazione = window.location.pathname + window.location.search;
    window.location.href = `login.html?redirect=${encodeURIComponent(destinazione)}`;
  }
  axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('healthlab_token');
    localStorage.removeItem('healthlab_ruolo');
    localStorage.removeItem('healthlab_id_utente');
    localStorage.removeItem('healthlab_nome');
    window.location.href = 'login.html';
  });

  const currentPage = window.location.pathname.split('/').pop();
  document.querySelectorAll('.hl-topnav-link, .hl-mobile-menu-link').forEach(link => {
    if (link.getAttribute('href') === currentPage) link.classList.add('active');
  });

  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.toggle('open');
  });

  const listEl = document.getElementById('refertiList');

  async function init() {
    try {
      const res = await axios.get(`${API_BASE_URL}/referti/me`);
      render(res.data);
    } catch (error) {
      listEl.innerHTML = '<p class="hl-empty"><i class="bi bi-wifi-off"></i>Impossibile caricare i referti. Riprova più tardi.</p>';
    }
  }

  function render(referti) {
    if (!referti.length) {
      listEl.innerHTML = '<p class="hl-empty"><i class="bi bi-file-earmark-medical"></i>Non hai ancora referti disponibili.</p>';
      return;
    }

    listEl.innerHTML = referti.map((r, i) => {
      const data = new Date(r.dataCaricamento);
      const dataStr = data.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });

      return `
        <div class="hl-referto-item" style="animation-delay: ${Math.min(i * 0.05, 0.4)}s;">
          <div class="hl-referto-info">
            <span class="icon"><i class="bi bi-file-earmark-pdf"></i></span>
            <div>
              <h3>${r.nomeServizio}</h3>
              <p class="meta">Disponibile dal ${dataStr}</p>
            </div>
          </div>
          <button type="button" class="hl-btn-download" data-id="${r.id}">
            <i class="bi bi-download me-1"></i> Scarica
          </button>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.hl-btn-download').forEach(btn => {
      btn.addEventListener('click', () => scarica(btn));
    });
  }

  async function scarica(btn) {
    const id = btn.dataset.id;
    btn.disabled = true;
    btn.innerHTML = 'Apertura…';

    try {
      const res = await axios.get(`${API_BASE_URL}/referti/${id}/download`, {
        responseType: 'blob'
      });

      // Crea un URL temporaneo per il PDF e lo apre in una nuova scheda
      const blob = new Blob([res.data], { type: 'application/pdf' });
      const url = window.URL.createObjectURL(blob);
      window.open(url, '_blank');

    } catch (error) {
      alert('Impossibile scaricare il referto. Riprova più tardi.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-download me-1"></i> Scarica';
    }
  }

  init();
</script>

</body>
</html>
