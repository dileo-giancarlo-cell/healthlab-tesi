<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthLab — Reimposta password</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --hl-900: #0a3a57; --hl-700: #0f6690; --hl-red: #c23b3b; --hl-mute: #5c6b74; }
  * { box-sizing: border-box; }
  body { font-family: "Source Sans 3", sans-serif; background: #f7fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 1rem; }
  .box { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e5edf1; border-radius: 16px; padding: 2.25rem; }
  .box h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--hl-900); margin-bottom: 0.4rem; }
  .box p { color: var(--hl-mute); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .form-control { border: 1px solid #d8e0e5; border-radius: 8px; padding: 0.6rem 0.8rem; }
  .btn-primary-hl { background: var(--hl-700); border: none; color: #fff; padding: 0.65rem 1rem; border-radius: 8px; font-weight: 700; width: 100%; }
  .btn-primary-hl:hover { background: var(--hl-900); color: #fff; }
  .hl-alert { display: none; background: #fdecec; border: 1px solid #f3c6c6; color: var(--hl-red); border-radius: 8px; padding: 0.65rem 0.85rem; font-size: 0.87rem; margin-bottom: 1rem; }
  .hl-alert.show { display: block; }
  .hl-alert-success { display: none; background: #e3f5ea; border: 1px solid #b8e0c4; color: #1c7a4a; border-radius: 8px; padding: 0.9rem; font-size: 0.9rem; }
  .hl-alert-success.show { display: block; }
  a.btn-primary-hl { display: block; text-align: center; text-decoration: none; margin-top: 1rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>Reimposta la tua password</h1>
    <p>Scegli una nuova password per il tuo account.</p>

    <div id="errorBox" class="hl-alert"></div>
    <div id="successBox" class="hl-alert-success"></div>

    <form id="resetForm">
      <div class="mb-3">
        <input type="password" class="form-control" id="nuovaPassword" placeholder="Nuova password" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="confermaPassword" placeholder="Conferma password" required>
      </div>
      <button type="submit" class="btn-primary-hl" id="submitBtn">Reimposta password</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script>
    const API_BASE_URL = 'http://localhost:8080/api';
    const token = new URLSearchParams(window.location.search).get('token');

    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      form.style.display = 'none';
      errorBox.textContent = 'Link non valido: manca il token di reset.';
      errorBox.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const nuovaPassword = document.getElementById('nuovaPassword').value;
      const confermaPassword = document.getElementById('confermaPassword').value;

      if (nuovaPassword !== confermaPassword) {
        errorBox.textContent = 'Le due password inserite non coincidono.';
        errorBox.classList.add('show');
        return;
      }
      if (nuovaPassword.length < 6) {
        errorBox.textContent = 'La password deve contenere almeno 6 caratteri.';
        errorBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Salvataggio…';

      try {
        const res = await axios.post(`${API_BASE_URL}/auth/reset-password`, { token, nuovaPassword });
        form.style.display = 'none';
        successBox.innerHTML = `${res.data.message} <a href="login.html" class="btn-primary-hl">Vai al login</a>`;
        successBox.classList.add('show');
      } catch (error) {
        errorBox.textContent = error.response?.data?.message || 'Errore imprevisto. Riprova.';
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reimposta password';
      }
    });
  </script>
</body>
</html>
