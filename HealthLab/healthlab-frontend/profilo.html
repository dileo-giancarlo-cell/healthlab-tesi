<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthLab — Il mio profilo</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --hl-white: #ffffff;
    --hl-900: #0a3a57;
    --hl-700: #0f6690;
    --hl-500: #1f8fc4;
    --hl-050: #eaf5fb;
    --hl-red: #c23b3b;
    --hl-ink: #16242c;
    --hl-mute: #5c6b74;
    --font-display: "Manrope", system-ui, sans-serif;
    --font-body: "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font-body); color: var(--hl-ink); background: #f7fafc; margin: 0; padding-top: 68px; }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.01em; }
  a { text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .hl-topbar {
    background: #fff; border-bottom: 1px solid #e5edf1; padding: 0.8rem 0;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  }
  .hl-brand { display: flex; align-items: center; gap: 0.6rem; color: var(--hl-900); }
  .hl-brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--hl-700);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hl-brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
  .hl-logout { color: var(--hl-mute); font-size: 0.88rem; font-weight: 600; }
  .hl-logout:hover { color: var(--hl-red); }

  .hl-mobile-menu-btn {
    display: none; background: none; border: none; color: var(--hl-900); font-size: 1.3rem;
    padding: 0.25rem 0.4rem; margin-left: 0.6rem;
  }
  @media (max-width: 767.98px) {
    .hl-mobile-menu-btn { display: inline-flex; align-items: center; }
  }
  .hl-mobile-menu { display: none; flex-direction: column; border-top: 1px solid #e5edf1; background: #fff; }
  .hl-mobile-menu.open { display: flex; }
  .hl-mobile-menu-link { padding: 0.85rem 1.2rem; color: var(--hl-ink); font-weight: 600; font-size: 0.92rem; border-bottom: 1px solid #f0f3f5; }
  .hl-mobile-menu-link:last-child { border-bottom: none; }
  .hl-mobile-menu-link.active { color: var(--hl-700); background: var(--hl-050); font-weight: 700; }

  .hl-topnav { gap: 0.2rem; }
  .hl-topnav-link { color: var(--hl-ink); font-weight: 600; font-size: 0.88rem; padding: 0.4rem 0.9rem; border-radius: 999px; }
  .hl-topnav-link:hover { color: var(--hl-700); }
  .hl-topnav-link.active { color: var(--hl-700); background: var(--hl-050); font-weight: 700; }

  .hl-content { max-width: 700px; margin: 0 auto; padding: 3rem 1rem 4rem; }

  @keyframes hl-fade-in-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hl-profile-header { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 2.2rem; animation: hl-fade-in-up 0.4s ease both; }
  .hl-avatar {
    width: 68px; height: 68px; border-radius: 50%;
    background: linear-gradient(155deg, var(--hl-500) 0%, var(--hl-900) 100%); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; flex-shrink: 0;
    box-shadow: 0 8px 20px -8px rgba(10,58,87,0.45);
  }
  .hl-profile-header h1 { font-size: 1.6rem; letter-spacing: -0.02em; font-weight: 800; color: var(--hl-900); margin: 0 0 0.15rem; }
  .hl-profile-header p { color: var(--hl-mute); margin: 0; font-size: 0.9rem; }

  .hl-stats-row { display: flex; gap: 1rem; margin-bottom: 2rem; }
  .hl-stat-card {
    flex: 1; background: #fff; border: 1px solid #edf1f4; border-radius: 12px;
    padding: 1.1rem; text-align: center;
    box-shadow: 0 1px 2px rgba(10,58,87,0.04), 0 10px 26px -20px rgba(10,58,87,0.22);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: hl-fade-in-up 0.4s ease both; animation-delay: 0.06s;
  }
  .hl-stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(10,58,87,0.06), 0 16px 34px -18px rgba(10,58,87,0.26); }
  .hl-stat-card .num { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; color: var(--hl-700); }
  .hl-stat-card .label { font-size: 0.8rem; color: var(--hl-mute); margin-top: 0.2rem; }

  .hl-info-card {
    background: #fff; border: 1px solid #edf1f4; border-radius: 12px; padding: 1.5rem;
    box-shadow: 0 1px 2px rgba(10,58,87,0.04), 0 10px 26px -20px rgba(10,58,87,0.22);
    animation: hl-fade-in-up 0.4s ease both; animation-delay: 0.12s;
  }
  .hl-info-card h2 { font-size: 1rem; font-weight: 700; color: var(--hl-900); margin-bottom: 1rem; }
  .hl-info-row { display: flex; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px solid #f0f3f5; font-size: 0.9rem; }
  .hl-info-row:last-child { border-bottom: none; }
  .hl-info-row .label { color: var(--hl-mute); }
  .hl-info-row .value { font-weight: 600; }

  .hl-loading, .hl-empty { text-align: center; color: var(--hl-mute); padding: 3rem 0; }
</style>
</head>
<body>

<div class="hl-topbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="home-interna.html" class="hl-brand">
      <span class="hl-brand-mark">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 13h4l2-7 3 14 3-10 2 3h6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="hl-brand-name">HealthLab</span>
    </a>
    <nav class="hl-topnav d-none d-md-flex align-items-center">
      <a href="home-interna.html" class="hl-topnav-link">Home</a>
      <a href="prenota.html" class="hl-topnav-link">Prenota</a>
      <a href="le-mie-prenotazioni.html" class="hl-topnav-link">Le mie prenotazioni</a>
      <a href="referti.html" class="hl-topnav-link">Referti</a>
      <a href="profilo.html" class="hl-topnav-link">Mio profilo</a>
    </nav>
    <div class="d-flex align-items-center">
      <a href="#" id="logoutLink" class="hl-logout"><i class="bi bi-box-arrow-right me-1"></i>Esci</a>
      <button type="button" class="hl-mobile-menu-btn" id="mobileMenuBtn" aria-label="Apri menu">
        <i class="bi bi-list"></i>
      </button>
    </div>
  </div>
  <div class="hl-mobile-menu" id="mobileMenu">
    <a href="home-interna.html" class="hl-mobile-menu-link">Home</a>
    <a href="prenota.html" class="hl-mobile-menu-link">Prenota</a>
    <a href="le-mie-prenotazioni.html" class="hl-mobile-menu-link">Le mie prenotazioni</a>
    <a href="referti.html" class="hl-mobile-menu-link">Referti</a>
    <a href="profilo.html" class="hl-mobile-menu-link">Mio profilo</a>
  </div>
</div>

<div class="hl-content" id="content">
  <p class="hl-loading">Caricamento profilo…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script>
  const API_BASE_URL = 'http://localhost:8080/api';

  const token = localStorage.getItem('healthlab_token');
  if (!token) {
    const destinazione = window.location.pathname + window.location.search;
    window.location.href = `login.html?redirect=${encodeURIComponent(destinazione)}`;
  }
  axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('healthlab_token');
    localStorage.removeItem('healthlab_ruolo');
    localStorage.removeItem('healthlab_id_utente');
    localStorage.removeItem('healthlab_nome');
    window.location.href = 'login.html';
  });

  const currentPage = window.location.pathname.split('/').pop();
  document.querySelectorAll('.hl-topnav-link, .hl-mobile-menu-link').forEach(link => {
    if (link.getAttribute('href') === currentPage) link.classList.add('active');
  });

  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.toggle('open');
  });

  const contentEl = document.getElementById('content');

  function formatSesso(s) {
    if (s === 'M') return 'Maschio';
    if (s === 'F') return 'Femmina';
    return 'n/d';
  }

  function formatData(d) {
    if (!d) return 'n/d';
    return new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  async function init() {
    try {
      const res = await axios.get(`${API_BASE_URL}/pazienti/me`);
      render(res.data);
    } catch (error) {
      contentEl.innerHTML = '<p class="hl-empty">Impossibile caricare il profilo. Riprova più tardi.</p>';
    }
  }

  function render(p) {
    const iniziali = (p.nome[0] || '') + (p.cognome[0] || '');

    contentEl.innerHTML = `
      <div class="hl-profile-header">
        <div class="hl-avatar">${iniziali.toUpperCase()}</div>
        <div>
          <h1>${p.nome} ${p.cognome}</h1>
          <p>${p.email}</p>
        </div>
      </div>

      <div class="hl-stats-row">
        <div class="hl-stat-card">
          <div class="num">${p.totalePrenotazioni}</div>
          <div class="label">Prenotazioni totali</div>
        </div>
        <div class="hl-stat-card">
          <div class="num">${p.totaleReferti}</div>
          <div class="label">Referti disponibili</div>
        </div>
      </div>

      <div class="hl-info-card">
        <h2>Dati anagrafici</h2>
        <div class="hl-info-row"><span class="label">Nome</span><span class="value">${p.nome}</span></div>
        <div class="hl-info-row"><span class="label">Cognome</span><span class="value">${p.cognome}</span></div>
        <div class="hl-info-row"><span class="label">Email</span><span class="value">${p.email}</span></div>
        <div class="hl-info-row"><span class="label">Codice fiscale</span><span class="value">${p.codiceFiscale || 'n/d'}</span></div>
        <div class="hl-info-row"><span class="label">Data di nascita</span><span class="value">${formatData(p.dataNascita)}</span></div>
        <div class="hl-info-row"><span class="label">Sesso</span><span class="value">${formatSesso(p.sesso)}</span></div>
      </div>
    `;
  }

  init();
</script>

</body>
</html>
