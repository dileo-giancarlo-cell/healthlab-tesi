services:
  mysql:
    image: mysql:8.0
    container_name: laboratorio-analisi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: healthlab
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laboratorio-analisi-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./healthlab-api
    container_name: laboratorio-analisi-backend
    restart: unless-stopped
    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/healthlab
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: app_password

     
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}

      # Con Nginx la cartella healthlab-frontend viene servita direttamente
      # come radice (non più sotto un sottopercorso /healthlab-frontend/
      # come faceva Live Server) — i link nelle email vanno quindi costruiti
      # senza quel suffisso.
      HEALTHLAB_FRONTEND_URL: http://localhost:5500

      # Percorsi interni al container
      HEALTHLAB_REFERTI_STORAGE_PATH: /app/referti-storage
      HEALTHLAB_CATEGORIE_STORAGE_PATH: /app/categoria-immagini-storage

      # Nessuna variabile CORS: il default già
      # scritto nel codice (localhost:5500) combacia esattamente con la
      # porta scelta sotto per il frontend containerizzato.
    ports:
      - "8080:8080"
    volumes:
      - referti_storage:/app/referti-storage
      - categoria_immagini_storage:/app/categoria-immagini-storage
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: laboratorio-analisi-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      # :ro (sola lettura) — il container non ha alcun motivo di scrivere
      # dentro la cartella del frontend, sono file statici.
      - ./healthlab-frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  referti_storage:
  categoria_immagini_storage: